r"><option value="new">新しい順</option><option value="old">古い順</option></select></div><div id="feed"></div><div class="empty" id="footer"></div></main><script>const DATA=[{"id": "1244543461870587905", "date": "2020-03-30T17:34:18.466000+09:00", "text": "キリ番でやる前にまず全良に近い成績残して挑んでみたいと思い詰めてみたら可3出ました。\n前半2個\n低速地帯全良\nラスゴー1個\n全良頑張ります。pic.twitter.com/CqTAmnckwK", "wayback": "https://web.archive.org/web/20200330084013/https://twitter.com/Yuuki_Taiko/status/1244543461870587905"}, {"id": "1244423021407813634", "date": "2020-03-30T09:35:43.222000+09:00", "text": "ということで普通と玄人そして達人譜面も全良したらカウントすることにします。https://twitter.com/yuuki_taiko/status/1243830278071566336 …", "wayback": "https://web.archive.org/web/20200330005112/https://twitter.com/Yuuki_Taiko/status/1244423021407813634"}, {"id": "1244264797681504258", "date": "2020-03-29T23:06:59.746000+09:00", "text": "#3月の上出来リザルト\n1枚だけやけど\nバージョン変わる前に全良出来てマジで良かったです。pic.twitter.com/IOG2r0BFlJ", "wayback": "https://web.archive.org/web/20200329140852/https://twitter.com/Yuuki_Taiko/status/1244264797681504258"}, {"id": "1244259735190175745", "date": "2020-03-29T22:46:52.754000+09:00", "text": "夢と希望ラスゴー抜けてから3回落としたのマジで地獄でした。\n全良\n672.乙女解剖（裏）\n673.夢と希望pic.twitter.com/iNnQmGeAs6", "wayback": "https://web.archive.org/web/20200329140521/https://twitter.com/Yuuki_Taiko/status/1244259735190175745"}, {"id": "1244202616386490370", "date": "2020-03-29T18:59:54.570000+09:00", "text": "そういえば新しいホーム台どこにするのかほぼ決定しました。\nこの先はそこでタイタツすることが多くなると思います。", "wayback": "https://web.archive.org/web/20200329100136/https://twitter.com/Yuuki_Taiko/status/1244202616386490370"}, {"id": "1244192248377405440", "date": "2020-03-29T18:18:42.644000+09:00", "text": "やるとしたらキリ番で。\n680か690譜面目でやろうかなと思う。https://twitter.com/yuuki_taiko/status/1244051685535649793 …", "wayback": "https://web.archive.org/web/20200329092511/https://twitter.com/Yuuki_Taiko/status/1244192248377405440"}, {"id": "1244170803693813760", "date": "2020-03-29T16:53:29.833000+09:00", "text": "7以下取り戻した後解禁したら全良したかったやつできました！！！\n全良671譜面目　名乗り（天上）pic.twitter.com/6Um4N9XWSX", "wayback": "https://web.archive.org/web/20200329075402/https://twitter.com/Yuuki_Taiko/status/1244170803693813760"}, {"id": "1244153970991353856", "date": "2020-03-29T15:46:36.604000+09:00", "text": "マジで今回の新曲で☆7以下多すぎて疲れましたが、これでようやく終わりです！！\n☆7以下制覇無事に取り戻すことが出来て良かったです！！！\nいぇーい！！！\n全良670譜面目　火星！！！pic.twitter.com/JMYrhRDihl", "wayback": "https://web.archive.org/web/20200329065828/https://twitter.com/Yuuki_Taiko/status/1244153970991353856"}, {"id": "1244128058652553216", "date": "2020-03-29T14:03:38.621000+09:00", "text": "今後これより早い回数で全良できる☆10マジで出てこんかも。pic.twitter.com/OG42S4kFz2", "wayback": "https://web.archive.org/web/20200329050734/https://twitter.com/Yuuki_Taiko/status/1244128058652553216"}, {"id": "1244111065325031424", "date": "2020-03-29T12:56:07.096000+09:00", "text": "ようやく火星解禁できました・・・。\n7以下取り戻す為にあと1譜面頑張ります！\nと同時にそのクレで全良出来ました！！！\nニジイロver初めての☆10全良です！！！\n全良669譜面目&☆10全良36譜面目\n旋風ノ舞【天】（裏）！！！pic.twitter.com/oDyenkDpMj", "wayback": "https://web.archive.org/web/20200329041011/https://twitter.com/Yuuki_Taiko/status/1244111065325031424"}, {"id": "1244104325267423233", "date": "2020-03-29T12:29:20.141000+09:00", "text": "24分dddk・・・。pic.twitter.com/8mZPbDAHFU", "wayback": "https://web.archive.org/web/20200329034110/https://twitter.com/Yuuki_Taiko/status/1244104325267423233"}, {"id": "1244051685535649793", "date": "2020-03-29T09:00:09.851000+09:00", "text": "次もし☆9で強そうなの何か全良したいなってなったらこれやると思う。pic.twitter.com/vpykdLDDzp", "wayback": "https://web.archive.org/web/20200329001350/https://twitter.com/Yuuki_Taiko/status/1244051685535649793"}, {"id": "1243845593404862470", "date": "2020-03-28T19:21:13.658000+09:00", "text": "まあどん子裏は分岐譜面が出る前におわってるんですけどね。https://twitter.com/yuuki_taiko/status/1020910334389829632 …", "wayback": "https://web.archive.org/web/20200328104938/https://twitter.com/Yuuki_Taiko/status/1243845593404862470"}, {"id": "1243830278071566336", "date": "2020-03-28T18:20:22.198000+09:00", "text": "どん子のファーストデート裏に分岐譜面があるってツイート見かけたんですけどどういう風にカウントすればいいですか？", "wayback": "https://web.archive.org/web/20200328093147/https://twitter.com/Yuuki_Taiko/status/1243830278071566336"}, {"id": "1243824024653725696", "date": "2020-03-28T17:55:31.267000+09:00", "text": "旋風天裏初プレイでこんなん出たんで長複合が分かったら次の☆10全良はこれにします。pic.twitter.com/8PPoqGbWaA", "wayback": "https://web.archive.org/web/20200328085644/https://twitter.com/Yuuki_Taiko/status/1243824024653725696"}, {"id": "1243823295528456193", "date": "2020-03-28T17:52:37.430000+09:00", "text": "全良668譜面目　サクリファイスpic.twitter.com/sqITtixA5S", "wayback": "https://web.archive.org/web/20200328085439/https://twitter.com/Yuuki_Taiko/status/1243823295528456193"}, {"id": "1243813759174369282", "date": "2020-03-28T17:14:43.786000+09:00", "text": "☆7以下残るは火星だけなんですどまだ解禁出来てません。\nでもそれ以外の☆7四曲全良出来ました！！！\n火星解禁したら最後の1曲頑張ります！！！\n全良\n664.via lactea\n665.ピースサイン\n666.GERMINATION\n667.スクロール・ミカpic.twitter.com/HGImhvA01w", "wayback": "https://web.archive.org/web/20200328082143/https://twitter.com/Yuuki_Taiko/status/1243813759174369282"}, {"id": "1243714246283649024", "date": "2020-03-28T10:39:18.064000+09:00", "text": "マジでこれhttps://twitter.com/drum_monsteer/status/1243704337135628288 …", "wayback": "https://web.archive.org/web/20200328021139/https://twitter.com/Yuuki_Taiko/status/1243714246283649024"}, {"id": "1243543407466864641", "date": "2020-03-27T23:20:26.916000+09:00", "text": "夜出直して更に4譜面全良増やせれました。Pretenderが一番ドブりました。\n後ろの2曲は同じクレで全良出来ました。\nそしてこれで新曲☆6以下終わりです。\n全良\n660.Pretender\n661.ハロー！どんちゃん\n662.ロボットロケンロー☆\n663.乙女解剖（表）pic.twitter.com/yIzuYABwzA", "wayback": "https://web.archive.org/web/20200327143906/https://twitter.com/Yuuki_Taiko/status/1243543407466864641"}, {"id": "1243472754147340288", "date": "2020-03-27T18:39:41.852000+09:00", "text": "多分最後火星になると思う。pic.twitter.com/2HV4ZQhSGD", "wayback": "https://web.archive.org/web/20200327094952/https://twitter.com/Yuuki_Taiko/status/1243472754147340288"}, {"id": "1243459974765744128", "date": "2020-03-27T17:48:55.010000+09:00", "text": "今日は4譜面全良出来ました！！！\n次回からも☆7以下制覇取り戻す為に頑張ります！！！\n全良659譜面目　今！！！pic.twitter.com/yeLTYuZD3i", "wayback": "https://web.archive.org/web/20200327090651/https://twitter.com/Yuuki_Taiko/status/1243459974765744128"}, {"id": "1243445364541153281", "date": "2020-03-27T16:50:51.661000+09:00", "text": "その後これは3回で全良出来ました！！！\n全良658譜面目\nHIMAWARI HAPPY！！！pic.twitter.com/W1VPMSTELz", "wayback": "https://web.archive.org/web/20200327080201/https://twitter.com/Yuuki_Taiko/status/1243445364541153281"}, {"id": "1243439448194342912", "date": "2020-03-27T16:27:21.094000+09:00", "text": "で、裏全良した後表も全良出来ました！！！\n表裏どっちもドブりましたが出来て良かったです！！！\n全良657譜面目\n愛にできることはまだあるかい（表）！！！pic.twitter.com/ORWCQDaNQu", "wayback": "https://web.archive.org/web/20200327072946/https://twitter.com/Yuuki_Taiko/status/1243439448194342912"}, {"id": "1243436630850957313", "date": "2020-03-27T16:16:09.387000+09:00", "text": "100万点ジャストチキン踏みましたが、その次のプレイで全良出来ました！！！\nニジイロver初全良です！！！\n全良656譜面目\n愛にできることはまだあるかい（裏）！！！pic.twitter.com/F8B6pU8smJ", "wayback": "https://web.archive.org/web/20200327071715/https://twitter.com/Yuuki_Taiko/status/1243436630850957313"}, {"id": "1243398531240439814", "date": "2020-03-27T13:44:45.732000+09:00", "text": "サビ入るまでがなかなか噛み合わん・・・。pic.twitter.com/3KcB4cT1QE", "wayback": "https://web.archive.org/web/20200327051545/https://twitter.com/Yuuki_Taiko/status/1243398531240439814"}, {"id": "1243303904143523843", "date": "2020-03-27T07:28:44.874000+09:00", "text": "俺まだニジイロ未プレイやのに王冠が前より増えてるのなんでやpic.twitter.com/0VjYDHxVZS", "wayback": "https://web.archive.org/web/20200326223835/https://twitter.com/Yuuki_Taiko/status/1243303904143523843"}, {"id": "1242396379428712449", "date": "2020-03-24T19:22:34.121000+09:00", "text": "てか新曲とスタートダッシュのやつ合わせたら☆7以下どんだけあるん？", "wayback": "https://web.archive.org/web/20200324150350/https://twitter.com/Yuuki_Taiko/status/1242396379428712449"}, {"id": "1242347480127160320", "date": "2020-03-24T16:08:15.619000+09:00", "text": "上限ないそうなので、フレンド募集します。\n誰でもどうぞ！pic.twitter.com/4wwTg0Q42O", "wayback": "https://web.archive.org/web/20200324120946/https://twitter.com/Yuuki_Taiko/status/1242347480127160320"}, {"id": "1242228178174656512", "date": "2020-03-24T08:14:11.817000+09:00", "text": "実際の全良数と100くらい差あんねんけど wwwwwwwwwpic.twitter.com/JReHuUPfaV", "wayback": "https://web.archive.org/web/20200324033918/https://twitter.com/Yuuki_Taiko/status/1242228178174656512"}, {"id": "1241700310180982784", "date": "2020-03-22T21:16:38.280000+09:00", "text": "#もうすぐグリーンも終わりなので今作を振り返ってみよう\n全良490→655\n☆10全良　17→35\n今作も10段維持出来て良かったです。\nニジイロverでは人段位取れるように精進します。pic.twitter.com/pVJAoUYZfh", "wayback": "https://web.archive.org/web/20200322123055/https://twitter.com/Yuuki_Taiko/status/1241700310180982784"}, {"id": "1236986389767438336", "date": "2020-03-09T21:05:12.073000+09:00", "text": "#私のイメージ曲はなんですか\nみんなは何やと思ってるんかな？", "wayback": "https://web.archive.org/web/20200309181027/https://twitter.com/Yuuki_Taiko/status/1236986389767438336"}, {"id": "1236965405425405956", "date": "2020-03-09T19:41:49.016000+09:00", "text": "【固定用】\n京都でドンドコしてます。pic.twitter.com/cU5CkH89bi", "wayback": "https://web.archive.org/web/20200309105140/https://twitter.com/Yuuki_Taiko/status/1236965405425405956"}, {"id": "1236259389247336449", "date": "2020-03-07T20:56:21.642000+09:00", "text": "650譜面目の時のリベンジ今日のラスクレでついに出来ました！！！\nグリーンで思い残すことはもうありません！！\nありがとうございました！！！\n全良654譜面目&☆10全良35譜面目・・・\nオーブの祈り　全良！！！\nやったぁぁぁぁ！！！！！pic.twitter.com/RQbCYUx7TH", "wayback": "https://web.archive.org/web/20200308011350/https://twitter.com/Yuuki_Taiko/status/1236259389247336449"}, {"id": "1236209396067127296", "date": "2020-03-07T17:37:42.339000+09:00", "text": "今日は不可ありのやつ含めて可1よく踏んでます・・・。pic.twitter.com/YZraJWYK0k", "wayback": "https://web.archive.org/web/20200307090051/https://twitter.com/Yuuki_Taiko/status/1236209396067127296"}, {"id": "1236128406653112322", "date": "2020-03-07T12:15:52.958000+09:00", "text": "発狂全良したのに・・・。pic.twitter.com/Y5QBHwwdgA", "wayback": "https://web.archive.org/web/20200307034543/https://twitter.com/Yuuki_Taiko/status/1236128406653112322"}, {"id": "1236113458149511168", "date": "2020-03-07T11:16:28.957000+09:00", "text": "はぁ・・・。pic.twitter.com/18duV23b4S", "wayback": "https://web.archive.org/web/20200307051714/https://twitter.com/Yuuki_Taiko/status/1236113458149511168"}, {"id": "1236105897287409665", "date": "2020-03-07T10:46:26.307000+09:00", "text": "1Pメンテあれやから\n2Pで全良するかもしれん。pic.twitter.com/YX86WZMs4t", "wayback": "https://web.archive.org/web/20200307100849/https://twitter.com/Yuuki_Taiko/status/1236105897287409665"}, {"id": "1235892849339551744", "date": "2020-03-06T20:39:51.718000+09:00", "text": "なかなか発狂噛み合いませんな・・・。pic.twitter.com/PcstYI5fBL", "wayback": "https://web.archive.org/web/20200306115750/https://twitter.com/Yuuki_Taiko/status/1235892849339551744"}, {"id": "1235886183504203777", "date": "2020-03-06T20:13:22.459000+09:00", "text": "発狂で2（1）\nラスゴー抜ける前の複合で0（1）。pic.twitter.com/p2UfU5JfLN", "wayback": "https://web.archive.org/web/20200306114817/https://twitter.com/Yuuki_Taiko/status/1235886183504203777"}, {"id": "1235550339891253249", "date": "2020-03-05T21:58:51.102000+09:00", "text": "もうグリーン終わるまでにやりたいこと言ったら今のところオーブ全良することしか思いつかんから次タイタツ行く時やるか。", "wayback": "https://web.archive.org/web/20200305135619/https://twitter.com/Yuuki_Taiko/status/1235550339891253249"}, {"id": "1235534579655565316", "date": "2020-03-05T20:56:13.569000+09:00", "text": "#もうすぐグリーンも終わりなので今作を振り返ってみよう\n人段位は地力不足等で諦めてしまったけど十段は取ることが出来て良かったです。\n全良増えるペースはブルーの時よりかは落ちましたけど100譜面以上増やせました。\nもう一度地力をつけ直して次作こそ人段位に昇段出来るよう頑張ろうと思います。pic.twitter.com/AyjsU4wBWE", "wayback": "https://web.archive.org/web/20200305115958/https://twitter.com/Yuuki_Taiko/status/1235534579655565316"}, {"id": "1235163614874501120", "date": "2020-03-04T20:22:08.673000+09:00", "text": "1週間くらい前フォロワー3650人やったのに今3600人切ってるのなんで？\n俺が何したっていうねん。", "wayback": "https://web.archive.org/web/20200304113443/https://twitter.com/Yuuki_Taiko/status/1235163614874501120"}, {"id": "1234469513879384065", "date": "2020-03-02T22:24:02.100000+09:00", "text": "#3月になったので音ゲーマーフォロー祭\nオーブの祈りを全良したい人です。\nキツいですが頑張ります。\nドンだーはフォロバします。pic.twitter.com/aj3elUDjCc", "wayback": "https://web.archive.org/web/20200302150521/https://twitter.com/Yuuki_Taiko/status/1234469513879384065"}, {"id": "1234083371497574400", "date": "2020-03-01T20:49:38.582000+09:00", "text": "しばらくやってんかったけどまだ感覚は残ってて良かった。\n近いうちにリベンジマッチしようと思います。pic.twitter.com/NqNroDYZYJ", "wayback": "https://web.archive.org/web/20200301123719/https://twitter.com/Yuuki_Taiko/status/1234083371497574400"}, {"id": "1234061653265674241", "date": "2020-03-01T19:23:20.552000+09:00", "text": "特良1個抜けて自己ベじゃないですけど、夏竜裏とりあえず可一桁乗りました！！！pic.twitter.com/lQAXDaBxYE", "wayback": "https://web.archive.org/web/20200301102707/https://twitter.com/Yuuki_Taiko/status/1234061653265674241"}, {"id": "1234040942530711553", "date": "2020-03-01T18:01:02.728000+09:00", "text": "低速地帯全良したのヤバいwwwwwwwwwwwwpic.twitter.com/pZULbCf5BH", "wayback": "https://web.archive.org/web/20200301090635/https://twitter.com/Yuuki_Taiko/status/1234040942530711553"}, {"id": "1233939089549742080", "date": "2020-03-01T11:16:19.085000+09:00", "text": "2枚目のところがめっちゃ苦手でしたしそこ通過してから出たりとかあって昨日から苦戦してたけどなんとか出来ました！！！\n全良653譜面目\n夏竜〜Karyu〜（表）！！！！！pic.twitter.com/YzOzd4ZesJ", "wayback": "https://web.archive.org/web/20200301033904/https://twitter.com/Yuuki_Taiko/status/1233939089549742080"}, {"id": "1233932281032540160", "date": "2020-03-01T10:49:15.808000+09:00", "text": "難所越えたのにクリアゲージ乗ったとこで多重起きてしんだ。pic.twitter.com/sDBumthrrO", "wayback": "https://web.archive.org/web/20200301015043/https://twitter.com/Yuuki_Taiko/status/1233932281032540160"}, {"id": "1233361201297416192", "date": "2020-02-28T20:59:59.789000+09:00", "text": "全良増やしと同時にこれもゆっくり埋めていけれるよう頑張ります。pic.twitter.com/5L6sjadyvG", "wayback": "https://web.archive.org/web/20200228121627/https://twitter.com/Yuuki_Taiko/status/1233361201297416192"}, {"id": "1233339597163122688", "date": "2020-02-28T19:34:08.962000+09:00", "text": "#2月の上出来リザルトpic.twitter.com/6kZL27O0Xi", "wayback": "https://web.archive.org/web/20200228103444/https://twitter.com/Yuuki_Taiko/status/1233339597163122688"}, {"id": "1233294252639055872", "date": "2020-02-28T16:33:57.985000+09:00", "text": "ラスト3コンボで散ってチキる大ドジ踏んでからラスゴーで癖ついたりとかあってめっちゃドブりましたが全良出来ました！！！\n全良652譜面目\n冬竜〜Toryu〜（表）！！！！！！pic.twitter.com/tByIu0MKWA", "wayback": "https://web.archive.org/web/20200228075116/https://twitter.com/Yuuki_Taiko/status/1233294252639055872"}, {"id": "1232607463179898880", "date": "2020-02-26T19:04:54.618000+09:00", "text": "【固定用】\n京都でタイタツしてる回数ドンです。\n上位曲苦手なんで上手くなりたいです。pic.twitter.com/u1pRchIJup", "wayback": "https://web.archive.org/web/20200226100517/https://twitter.com/Yuuki_Taiko/status/1232607463179898880"}, {"id": "1231536541924593669", "date": "2020-02-23T20:09:27.094000+09:00", "text": "660コンボぐらいまで全良してた。pic.twitter.com/bPXZJru1jZ", "wayback": "https://web.archive.org/web/20200223111834/https://twitter.com/Yuuki_Taiko/status/1231536541924593669"}, {"id": "1231530300062105601", "date": "2020-02-23T19:44:38.918000+09:00", "text": "不可出たけどギガンティック裏可一桁乗った。pic.twitter.com/CfTLlPYEyM", "wayback": "https://web.archive.org/web/20200223105529/https://twitter.com/Yuuki_Taiko/status/1231530300062105601"}, {"id": "1231496173774499840", "date": "2020-02-23T17:29:02.577000+09:00", "text": "オーブの祈りが無理すぎて、これ狙うことにしたんですけど、めっちゃ地獄見ました・・・。\nでもやっと全良出来ました！！！\n結果的には妥協という形にはなりましたが、これで600ワールド折り返しまで来ました！！\nいぇーーい！！！\n全良650譜面目&☆10全良34譜面目\nタイコロール　全良！！！！！！pic.twitter.com/v9TlE7nvP5", "wayback": "https://web.archive.org/web/20200223083856/https://twitter.com/Yuuki_Taiko/status/1231496173774499840"}, {"id": "1231491344993882117", "date": "2020-02-23T17:09:51.306000+09:00", "text": "最後の低速です・・・。pic.twitter.com/dnenGaz0G5", "wayback": "https://web.archive.org/web/20200223081839/https://twitter.com/Yuuki_Taiko/status/1231491344993882117"}, {"id": "1231222599725670402", "date": "2020-02-22T23:21:57.441000+09:00", "text": "ブルー         グリーン\n           10段                10段\n  全良　490              649\n☆10全良 17                33\n\n全良は増えてるんやけどな・・・。", "wayback": "https://web.archive.org/web/20200222143219/https://twitter.com/Yuuki_Taiko/status/1231222599725670402"}, {"id": "1231125734715846656", "date": "2020-02-22T16:57:03.023000+09:00", "text": "出た場所全部2枚目のところ。pic.twitter.com/nbYjcGYT1I", "wayback": "https://web.archive.org/web/20200222080857/https://twitter.com/Yuuki_Taiko/status/1231125734715846656"}, {"id": "1231090957593874434", "date": "2020-02-22T14:38:51.511000+09:00", "text": "最初と最後の低速だけ。pic.twitter.com/CfPX0RKIBa", "wayback": "https://web.archive.org/web/20200222054746/https://twitter.com/Yuuki_Taiko/status/1231090957593874434"}, {"id": "1231074219242352640", "date": "2020-02-22T13:32:20.777000+09:00", "text": "とりま一桁乗った。\n最初の低速全良して\n最後の低速入るまで可2やった。pic.twitter.com/0Ht5xdt45u", "wayback": "https://web.archive.org/web/20200222043832/https://twitter.com/Yuuki_Taiko/status/1231074219242352640"}, {"id": "1231028900387360768", "date": "2020-02-22T10:32:15.920000+09:00", "text": "とりあえず初フル\n最初の低速で半分くらい出た。pic.twitter.com/QH04aE68HQ", "wayback": "https://web.archive.org/web/20200222014244/https://twitter.com/Yuuki_Taiko/status/1231028900387360768"}, {"id": "1231013207516442626", "date": "2020-02-22T09:29:54.448000+09:00", "text": "#タメ口で絡んでもいいよって人いいねしてください\n久々に\nFF内\nメンションせずそのままリストに入れます。\nもしタメ解してるか分からんかったらそのリストを見て下さい。\nタメ解してる人はスルー。", "wayback": "https://web.archive.org/web/20200222005015/https://twitter.com/Yuuki_Taiko/status/1231013207516442626"}, {"id": "1229724250526736386", "date": "2020-02-18T20:08:03.154000+09:00", "text": "正攻法でやろかな・・・。pic.twitter.com/hRLfPGm0Ai", "wayback": "https://web.archive.org/web/20200218111315/https://twitter.com/Yuuki_Taiko/status/1229724250526736386"}, {"id": "1228969897775882245", "date": "2020-02-16T18:10:31.443000+09:00", "text": "難所一つも絡んでません・・・。pic.twitter.com/hqgtbbaf5a", "wayback": "https://web.archive.org/web/20200216091732/https://twitter.com/Yuuki_Taiko/status/1228969897775882245"}, {"id": "1228958305126502400", "date": "2020-02-16T17:24:27.540000+09:00", "text": "オーブ可3出た。\n1個目は難所入る前の12分で出た。\nで残りは難所の4つ目の24分dddkで。pic.twitter.com/fsU0y6VuuK", "wayback": "https://web.archive.org/web/20200216082552/https://twitter.com/Yuuki_Taiko/status/1228958305126502400"}, {"id": "1228926197532200960", "date": "2020-02-16T15:16:52.493000+09:00", "text": "オーブ詰めるの一旦やめる。pic.twitter.com/lt42gTAxg2", "wayback": "https://web.archive.org/web/20200216062507/https://twitter.com/Yuuki_Taiko/status/1228926197532200960"}, {"id": "1228863547393765377", "date": "2020-02-16T11:07:55.536000+09:00", "text": "最後のkkdで2個も可だしたのもったいない。\nちなみにあの難所も2個。pic.twitter.com/BkKJziw7Hf", "wayback": "https://web.archive.org/web/20200216021656/https://twitter.com/Yuuki_Taiko/status/1228863547393765377"}, {"id": "1228638256247365632", "date": "2020-02-15T20:12:41.941000+09:00", "text": "オーブの祈り不可出たけど初めて可一桁乗ったし\n1枚目突入前まで全良やったし、しかも全部この辺でしか出てないのヤバい。pic.twitter.com/lDvnlljUDE", "wayback": "https://web.archive.org/web/20200215112450/https://twitter.com/Yuuki_Taiko/status/1228638256247365632"}, {"id": "1228600450607267840", "date": "2020-02-15T17:42:28.374000+09:00", "text": "700コンボぐらいまで全良pic.twitter.com/tHpPSjeddT", "wayback": "https://web.archive.org/web/20200215084357/https://twitter.com/Yuuki_Taiko/status/1228600450607267840"}, {"id": "1228583627522363392", "date": "2020-02-15T16:35:37.438000+09:00", "text": "チキン踏みまくったし、なかなか噛み合わんくてガチでしんどかったです・・・。\nでもようやく決着つけることが出来ました！！！！\nマジで嬉しいです！！！\nやったぁぁぁぁ！！！！！\nさちさちにしてあげる♪（裏）\n全良！！！！！！！！pic.twitter.com/xDbi0xtqyp", "wayback": "https://web.archive.org/web/20200215075155/https://twitter.com/Yuuki_Taiko/status/1228583627522363392"}, {"id": "1228539181615349760", "date": "2020-02-15T13:39:00.708000+09:00", "text": "2個目のドンラッシュの後・・・。pic.twitter.com/91kcZlXl3Z", "wayback": "https://web.archive.org/web/20200215045909/https://twitter.com/Yuuki_Taiko/status/1228539181615349760"}, {"id": "1226483390804709376", "date": "2020-02-09T21:30:01.984000+09:00", "text": "とある10段wwwwwwwwwwwwwwwhttps://twitter.com/taiko0921kaede/status/1226388737464119296 …", "wayback": "https://web.archive.org/web/20200209125012/https://twitter.com/Yuuki_Taiko/status/1226483390804709376"}, {"id": "1226468757054181376", "date": "2020-02-09T20:31:53.026000+09:00", "text": "0（2）の後、チキンも3回踏みました・・・。\n2枚目はラスクレラストだったんですけど最後の面ラッシュでやらかしました・・・。\nまた次回頑張ります。pic.twitter.com/Q9qdB8sudK", "wayback": "https://web.archive.org/web/20200209120107/https://twitter.com/Yuuki_Taiko/status/1226468757054181376"}, {"id": "1226423146166669312", "date": "2020-02-09T17:30:38.543000+09:00", "text": "1年くらい前に1（1）を3回くらい踏んで諦めたことあるからこういう可の数安定してきたらそろそろ決着つけたい。pic.twitter.com/n1gZzTlK9W", "wayback": "https://web.archive.org/web/20200209083128/https://twitter.com/Yuuki_Taiko/status/1226423146166669312"}, {"id": "1226411329335873536", "date": "2020-02-09T16:43:41.191000+09:00", "text": "まんまとドッキリに引っ掛かりましたwwwwwwwwwwwwwwwwwwwwwhttps://twitter.com/blue_cat222/status/1226411032681148416 …", "wayback": "https://web.archive.org/web/20200209080615/https://twitter.com/Yuuki_Taiko/status/1226411329335873536"}, {"id": "1226406411820646402", "date": "2020-02-09T16:24:08.764000+09:00", "text": "最初の面ラッシュで1個とラスゴーで2個。pic.twitter.com/rceEGNZvoj", "wayback": "https://web.archive.org/web/20200209074430/https://twitter.com/Yuuki_Taiko/status/1226406411820646402"}, {"id": "1226400738605027328", "date": "2020-02-09T16:01:36.164000+09:00", "text": "達人譜面全良した勢いで玄人譜面も全良出来ました！！！\n全良648譜面目\n風雲志士（玄人譜面）！！！！pic.twitter.com/YJMcfHYe3k", "wayback": "https://web.archive.org/web/20200209071619/https://twitter.com/Yuuki_Taiko/status/1226400738605027328"}, {"id": "1226119675836129282", "date": "2020-02-08T21:24:45.578000+09:00", "text": "あとこれ大音で5個ぐらい出したのガチでもったいなかった。pic.twitter.com/pL7oAYEDIU", "wayback": "https://web.archive.org/web/20200208173549/https://twitter.com/Yuuki_Taiko/status/1226119675836129282"}, {"id": "1226118788539510785", "date": "2020-02-08T21:21:14.030000+09:00", "text": "今日は2週間ぶりに☆10以外の全良狙いしました。\n24分＋16分の所で可でまくってましたが、全良出来ました！！！\n全良646譜面目\nリスドンヴァルナの黄昏！！！！pic.twitter.com/rag8NL4yHc", "wayback": "https://web.archive.org/web/20200208171818/https://twitter.com/Yuuki_Taiko/status/1226118788539510785"}, {"id": "1225960322147577857", "date": "2020-02-08T10:51:32.698000+09:00", "text": "ってことは全良数とかもリセットする必要ないってこと？", "wayback": "https://web.archive.org/web/20200208114542/https://twitter.com/Yuuki_Taiko/status/1225960322147577857"}, {"id": "1223883831414931457", "date": "2020-02-02T17:20:18.728000+09:00", "text": "430コンボまで全良やって残り2個ラスゴーpic.twitter.com/gBBAvaPyur", "wayback": "https://web.archive.org/web/20200203074426/https://twitter.com/Yuuki_Taiko/status/1223883831414931457"}, {"id": "1223851726848946176", "date": "2020-02-02T15:12:44.403000+09:00", "text": "とりあえず初フルpic.twitter.com/AyoCITbZqI", "wayback": "https://web.archive.org/web/20200204000405/https://twitter.com/Yuuki_Taiko/status/1223851726848946176"}, {"id": "1223788045746372609", "date": "2020-02-02T10:59:41.645000+09:00", "text": "これこんな揺れてるの初めて知ったwww", "wayback": "https://web.archive.org/web/20200202191123/https://twitter.com/Yuuki_Taiko/status/1223788045746372609"}, {"id": "1223737586868346882", "date": "2020-02-02T07:39:11.311000+09:00", "text": "0が2個あるやつのどれか一つを理論値全良してみたいんやけどな・・・。pic.twitter.com/xXfilS8mlC", "wayback": "https://web.archive.org/web/20200202163450/https://twitter.com/Yuuki_Taiko/status/1223737586868346882"}, {"id": "1223533043983343616", "date": "2020-02-01T18:06:24.487000+09:00", "text": "前回1番全良した後にやってチキってそこから長かったですがついに来ました！！！！！\nこれでそつおめしき1番、2番両方全良出来ました！！！！！\nいぇーーい！！！！！！\nそつおめしき2ばん　全良！！！！！！pic.twitter.com/ixD99RbR7z", "wayback": "https://web.archive.org/web/20200202110922/https://twitter.com/Yuuki_Taiko/status/1223533043983343616"}, {"id": "1223201226919043072", "date": "2020-01-31T20:07:53.134000+09:00", "text": "#1月の上出来リザルト\nいろいろあった月でした。\n2月も頑張ります。pic.twitter.com/XE1h8zeL1l", "wayback": "https://web.archive.org/web/20200201033819/https://twitter.com/Yuuki_Taiko/status/1223201226919043072"}, {"id": "1221401885434728449", "date": "2020-01-26T20:57:56.694000+09:00", "text": "言い忘れてたけどこれでイエロー10段理論値金合格しました。（17（2）-0-1）https://twitter.com/yuuki_taiko/status/1221219749666799616 …", "wayback": "https://web.archive.org/web/20200126135405/https://twitter.com/Yuuki_Taiko/status/1221401885434728449"}, {"id": "1221386196909051910", "date": "2020-01-26T19:55:36.258000+09:00", "text": "ゲゲゲ裏初フルの時写真撮り忘れたんで、何回かフルしました。pic.twitter.com/Zu7sFoMnFF", "wayback": "https://web.archive.org/web/20200126162813/https://twitter.com/Yuuki_Taiko/status/1221386196909051910"}, {"id": "1221315652696174592", "date": "2020-01-26T15:15:17.207000+09:00", "text": "可落ちより不可落ちが多かったです。イグニスが苦手すぎたんで無理と思ってました。\n今日詰めてそれから挑戦してみたら合格出来ました！！！！\nこれでムラサキ〜イエローまでの復活10段全部合格できました！！！！\n太鼓の達人　グリーンver.\n「復活！レッド10段」合格！！！！！pic.twitter.com/FSNNXXJkXq", "wayback": "https://web.archive.org/web/20200126115113/https://twitter.com/Yuuki_Taiko/status/1221315652696174592"}, {"id": "1221295725696274434", "date": "2020-01-26T13:56:06.240000+09:00", "text": "20台まで減らせれた。pic.twitter.com/Tnw3UAQPPJ", "wayback": "https://web.archive.org/web/20200126155154/https://twitter.com/Yuuki_Taiko/status/1221295725696274434"}, {"id": "1221219749666799616", "date": "2020-01-26T08:54:12.143000+09:00", "text": "ちなみに全良後2ばんもやってました。\n最初・・・。pic.twitter.com/G5lsQXtknD", "wayback": "https://web.archive.org/web/20200126023248/https://twitter.com/Yuuki_Taiko/status/1221219749666799616"}, {"id": "1221218627795316736", "date": "2020-01-26T08:49:44.668000+09:00", "text": "ラストでは幾度となく散りまくるわ、サビの長複合で癖がついてしまうわなどめっちゃ辛かったですがついに終わりました！！！！！！！\nマジで嬉しいです！！！！！\nやったぁぁぁぁ！！！！！\nそつおめしき　全良！！！！！！！pic.twitter.com/6lLRas92FI", "wayback": "https://web.archive.org/web/20200126023430/https://twitter.com/Yuuki_Taiko/status/1221218627795316736"}, {"id": "1221217758756556800", "date": "2020-01-26T08:46:17.473000+09:00", "text": "遅れたけどらんあすは昨日はセッションありがとう！！！（セッション後にタメ解しました。）pic.twitter.com/a2hrB4yQmM", "wayback": "https://web.archive.org/web/20200126040551/https://twitter.com/Yuuki_Taiko/status/1221217758756556800"}, {"id": "1221217088338972672", "date": "2020-01-26T08:43:37.633000+09:00", "text": "ようやく落ち着いてきたので、昨日の太鼓の収穫を言います。一つ大きな収穫があったのでそれも言います。", "wayback": "https://web.archive.org/web/20200126041626/https://twitter.com/Yuuki_Taiko/status/1221217088338972672"}, {"id": "1220916911237746688", "date": "2020-01-25T12:50:49.835000+09:00", "text": "昨日した回数のことについてのツイートは\n不快に感じる方が一部いましたので削除しました。\nこれからは言葉選びには気をつけようと思います。\n一部だけでなくこのツイートを見てる皆さんにも謝っておこうと思います。\n本当にすいませんでした。", "wayback": "https://web.archive.org/web/20200125041120/https://twitter.com/Yuuki_Taiko/status/1220916911237746688"}, {"id": "1220863285743865859", "date": "2020-01-25T09:17:44.521000+09:00", "text": "まだ今日やり始めて2回目やけどラストまで行けた。pic.twitter.com/hiEAmd0QCr", "wayback": "https://web.archive.org/web/20200125003045/https://twitter.com/Yuuki_Taiko/status/1220863285743865859"}, {"id": "1220666796509814784", "date": "2020-01-24T20:16:57.837000+09:00", "text": "☆7以下制覇取り戻せました！！\nその後にやったA3裏がこの3譜面の中で1番かからんかったのビックリしましたwwwwww\n全良\n641.刀剣乱舞\n642.Act!Addict!Actors!（表）\n643.Act!Addict!Actors!（裏）pic.twitter.com/IUzuqRD0zS", "wayback": "https://web.archive.org/web/20200124114023/https://twitter.com/Yuuki_Taiko/status/1220666796509814784"}, {"id": "1220643527937294336", "date": "2020-01-24T18:44:30.177000+09:00", "text": "「○○にそんな回数かけるとかwww」とか言ってバカにする人とはマジで仲良くなろうと思わへん。\nどういう神経してんの？って思う。", "wayback": "https://web.archive.org/web/20200124100156/https://twitter.com/Yuuki_Taiko/status/1220643527937294336"}, {"id": "1219956755423059969", "date": "2020-01-22T21:15:30.850000+09:00", "text": "今日は全然出来んかったけど一応1回ラストまでは行けた。\nてか詰めてる時1日に1回は必ずこのリザルト出るんだがwwwwwwpic.twitter.com/whmaFD3ufF", "wayback": "https://web.archive.org/web/20200122122152/https://twitter.com/Yuuki_Taiko/status/1219956755423059969"}, {"id": "1219814044737007617", "date": "2020-01-22T11:48:25.971000+09:00", "text": "正直今日☆7以下制覇を取り戻してからそつおめ全良狙いをしようと思ってましたが、気が変わりました。\nしんどいことには変わりないですが、もう少しだけそつおめ全良を頑張ってみます。", "wayback": "https://web.archive.org/web/20200122035154/https://twitter.com/Yuuki_Taiko/status/1219814044737007617"}, {"id": "1219747606919647232", "date": "2020-01-22T07:24:25.961000+09:00", "text": "A3裏できんくらいヤバい譜面じゃない限り643譜面目にやる。\n無理やったらそこでそつおめやる。", "wayback": "https://web.archive.org/web/20200121223252/https://twitter.com/Yuuki_Taiko/status/1219747606919647232"}, {"id": "1219615042011746305", "date": "2020-01-21T22:37:40.024000+09:00", "text": "今日もラストの壁に阻まれて全良出来ませんでした・・・。\nこれ全部ラストで出ました・・・。　\n3枚目と4枚目は4つ目で出しました。\nもう何回も最後で散りまくっててかなりしんどいですが頑張ります。pic.twitter.com/tT7mZLTAK6", "wayback": "https://web.archive.org/web/20200121135300/https://twitter.com/Yuuki_Taiko/status/1219615042011746305"}, {"id": "1219235711603183618", "date": "2020-01-20T21:30:20.607000+09:00", "text": "1番全良出来たら全良狙い考えるかも。https://twitter.com/yuuki_taiko/status/1219230063645741057 …", "wayback": "https://web.archive.org/web/20200120152141/https://twitter.com/Yuuki_Taiko/status/1219235711603183618"}, {"id": "1219230063645741057", "date": "2020-01-20T21:07:54.029000+09:00", "text": "息抜きに2ばんもやってたけど、これもやっと一桁乗った。\nでも凡ミスして一桁フル逃したの悔しい。pic.twitter.com/jCblvcJpfH", "wayback": "https://web.archive.org/web/20200120135452/https://twitter.com/Yuuki_Taiko/status/1219230063645741057"}, {"id": "1219211136135921665", "date": "2020-01-20T19:52:41.359000+09:00", "text": "最後出ませんでした・・・。\nしかも出たところ普通の単音でした。pic.twitter.com/QVLbEbYpxY", "wayback": "https://web.archive.org/web/20200120111112/https://twitter.com/Yuuki_Taiko/status/1219211136135921665"}, {"id": "1219204302096322563", "date": "2020-01-20T19:25:31.997000+09:00", "text": "マジで1個目で出たらそれ以外全良とかいうのも何回かあるからヤバい。", "wayback": "https://web.archive.org/web/20200120132547/https://twitter.com/Yuuki_Taiko/status/1219204302096322563"}, {"id": "1219203345937649664", "date": "2020-01-20T19:21:44.031000+09:00", "text": "ラストのあれ3つ目まで耐えたら4つ目で絶対出てしまうんだよな・・・。pic.twitter.com/UfRLSo7kVq", "wayback": "https://web.archive.org/web/20200120133742/https://twitter.com/Yuuki_Taiko/status/1219203345937649664"}, {"id": "1218854502624722945", "date": "2020-01-19T20:15:33.304000+09:00", "text": "今日は帰ります。\n今日だけでラストで10回以上はやられました・・・。\n次回また頑張ります。", "wayback": "https://web.archive.org/web/20200119174252/https://twitter.com/Yuuki_Taiko/status/1218854502624722945"}, {"id": "1218828065247096832", "date": "2020-01-19T18:30:30.142000+09:00", "text": "最後全良でした・・・。pic.twitter.com/YgmqiVI2J7", "wayback": "https://web.archive.org/web/20200119153552/https://twitter.com/Yuuki_Taiko/status/1218828065247096832"}, {"id": "1218777075252752384", "date": "2020-01-19T15:07:53.180000+09:00", "text": "やらかしました・・・。orzpic.twitter.com/lNKI0IdyAi", "wayback": "https://web.archive.org/web/20200119085630/https://twitter.com/Yuuki_Taiko/status/1218777075252752384"}, {"id": "1218771486900543489", "date": "2020-01-19T14:45:40.813000+09:00", "text": "は？wwwwwwwwwwwwwwwpic.twitter.com/lOa1zGifpZ", "wayback": "https://web.archive.org/web/20200119123906/https://twitter.com/Yuuki_Taiko/status/1218771486900543489"}, {"id": "1218746827337388034", "date": "2020-01-19T13:07:41.515000+09:00", "text": "これ全部最後のあの地帯で出ました・・・。pic.twitter.com/ehFLj5kWFE", "wayback": "https://web.archive.org/web/20200119113632/https://twitter.com/Yuuki_Taiko/status/1218746827337388034"}, {"id": "1218731037783552000", "date": "2020-01-19T12:04:56.992000+09:00", "text": "KUSANAGIフル出来たけど可一桁乗らんかった・・・。pic.twitter.com/kDZUOtDzRA", "wayback": "https://web.archive.org/web/20200119122255/https://twitter.com/Yuuki_Taiko/status/1218731037783552000"}, {"id": "1218490552758370304", "date": "2020-01-18T20:09:20.894000+09:00", "text": "今気付いたけどKUSANAGI可一桁乗りそうやった。pic.twitter.com/IPTjF527Zc", "wayback": "https://web.archive.org/web/20200119213305/https://twitter.com/Yuuki_Taiko/status/1218490552758370304"}, {"id": "1218466678423445504", "date": "2020-01-18T18:34:28.809000+09:00", "text": "最初の90コンボと終盤で散ることがかなりあったからめっちゃキツかったですが全良出来ました！！！\n全良640譜面目\nアイ MUST GO！！！pic.twitter.com/KgCyAt11uK", "wayback": "https://web.archive.org/web/20200119080050/https://twitter.com/Yuuki_Taiko/status/1218466678423445504"}, {"id": "1218438710250762241", "date": "2020-01-18T16:43:20.677000+09:00", "text": "ひろとおめでとう！！！！！！！！！pic.twitter.com/vX2sEczBAy", "wayback": "https://web.archive.org/web/20200118120622/https://twitter.com/Yuuki_Taiko/status/1218438710250762241"}, {"id": "1218431896004071424", "date": "2020-01-18T16:16:16.034000+09:00", "text": "ひとまずうちゅうひこうしフルコンボ出来ました。\nフルする前可22まで減らせれました。pic.twitter.com/YvJEXsNy5A", "wayback": "https://web.archive.org/web/20200118230918/https://twitter.com/Yuuki_Taiko/status/1218431896004071424"}, {"id": "1218086343198134273", "date": "2020-01-17T17:23:09.825000+09:00", "text": "そういえば今日iPhoneに機種変しました。", "wayback": "https://web.archive.org/web/20200118061529/https://twitter.com/Yuuki_Taiko/status/1218086343198134273"}, {"id": "1216292108627144709", "date": "2020-01-12T18:33:30.968000+09:00", "text": "今日詰め始めてまさか1日で合格出来るなんて思いませんでした。\nカラ鞠とてんぢくが苦手すぎて無理やと思ってたんで、合格出来て良かったです！！！\nいぇーーい！！！\n太鼓の達人 グリーンver.\n「復活！ムラサキ10段」合格！！！！！pic.twitter.com/u4Il81Tf2D", "wayback": "https://web.archive.org/web/20200115084800/https://twitter.com/Yuuki_Taiko/status/1216292108627144709"}, {"id": "1216274728677040128", "date": "2020-01-12T17:24:27.265000+09:00", "text": "てんぢくの最後のkkdd地帯で落ちた・・・。pic.twitter.com/otlFyqRrMo", "wayback": "https://web.archive.org/web/20200118140145/https://twitter.com/Yuuki_Taiko/status/1216274728677040128"}, {"id": "1215961068788301824", "date": "2020-01-11T20:38:04.920000+09:00", "text": "わかる", "wayback": "https://web.archive.org/web/20200116183416/https://twitter.com/Yuuki_Taiko/status/1215961068788301824"}, {"id": "1215955888445349889", "date": "2020-01-11T20:17:29.830000+09:00", "text": "ちょっと前にやった診断メーカーが全良狙うきっかけになってやってみたらめっちゃ苦戦しました・・・。\nこの時ラスト前まで初めて全良してめっちゃ緊張しましたが、ラストも全良して終わらせることができました！！！\n全良639譜面目\n花オト裏拍子！！！！pic.twitter.com/5Ha1vFIlV9", "wayback": "https://web.archive.org/web/20200118050100/https://twitter.com/Yuuki_Taiko/status/1215955888445349889"}, {"id": "1215869505978556416", "date": "2020-01-11T14:34:14.645000+09:00", "text": "撮り忘れましたがさっき花オト裏拍子0（4）出しました・・・。\n最初のゴーゴー入る前の複合で叩き間違えてこうなりました・・・。orz", "wayback": "https://web.archive.org/web/20200116165639/https://twitter.com/Yuuki_Taiko/status/1215869505978556416"}, {"id": "1215601088138637314", "date": "2020-01-10T20:47:38.845000+09:00", "text": "24分地帯入るまで全良してて、そこで2個とラストで1個。\nラストマジでムズすぎる・・・。\n1回だけ全良したけどまぐれな感じで全良通過したからヤバい。pic.twitter.com/kS0wFirfNT", "wayback": "https://web.archive.org/web/20200110124024/https://twitter.com/Yuuki_Taiko/status/1215601088138637314"}, {"id": "1215246664211943424", "date": "2020-01-09T21:19:17.596000+09:00", "text": "とりま初フル&可一桁乗った。pic.twitter.com/L0g0oOUnBf", "wayback": "https://web.archive.org/web/20200112103722/https://twitter.com/Yuuki_Taiko/status/1215246664211943424"}, {"id": "1214914029166030851", "date": "2020-01-08T23:17:31.221000+09:00", "text": "ゆうきは『花オト裏拍子』を全良します\nゆうきさん花オト裏拍子の全良頑張って！！w\n#shindanmaker\nhttps://shindanmaker.com/474393 \n 今度やってみていけそうなら頑張ってみよかな・・・。", "wayback": "https://web.archive.org/web/20200111064939/https://twitter.com/Yuuki_Taiko/status/1214914029166030851"}, {"id": "1214151382401347584", "date": "2020-01-06T20:47:02.063000+09:00", "text": "【固定用】\n京都でタイタツしてます。pic.twitter.com/Tjb3a9tQU2", "wayback": "https://web.archive.org/web/20200110200313/https://twitter.com/Yuuki_Taiko/status/1214151382401347584"}, {"id": "1213804959252152321", "date": "2020-01-05T21:50:28.348000+09:00", "text": "教授セッションありがとう！！！pic.twitter.com/5gxLRvHXOI", "wayback": "https://web.archive.org/web/20200110101054/https://twitter.com/Yuuki_Taiko/status/1213804959252152321"}, {"id": "1213781782312521733", "date": "2020-01-05T20:18:22.535000+09:00", "text": "グリーン10段受かってからR.I.とともにいつか全良したいと思ってました。チキってからかなり長かったし今までの☆9以下の譜面で一番キツかったけど、ようやく全良出来ました！！！！！！\nマジで嬉しいです！！！！！\nやったぁぁぁぁぁ！！！！！\n全良638譜面目・・・\n千鼓千鼓 ！！！！！！！pic.twitter.com/F3s4vPeF6O", "wayback": "https://web.archive.org/web/20200110075306/https://twitter.com/Yuuki_Taiko/status/1213781782312521733"}, {"id": "1213435553007337473", "date": "2020-01-04T21:22:35.036000+09:00", "text": "今日300コンボの前の苦手な所何回も全良出来たのに噛み合いませんでした・・・。\n現時点での最高到達点は2枚目の24分の後です。\n次回も頑張ります・・・。pic.twitter.com/gcmVkYsS8j", "wayback": "https://web.archive.org/web/20200111145658/https://twitter.com/Yuuki_Taiko/status/1213435553007337473"}, {"id": "1213074633592725505", "date": "2020-01-03T21:28:25.142000+09:00", "text": "Abyss of hell裏フルコンボ出来ました！！！\nフルする前に可20とか出たんで、もうちょっと減らしたかったです。pic.twitter.com/S7UT7j8jPj", "wayback": "https://web.archive.org/web/20200110001434/https://twitter.com/Yuuki_Taiko/status/1213074633592725505"}, {"id": "1213046731601920000", "date": "2020-01-03T19:37:32.789000+09:00", "text": "次は・・・。https://twitter.com/Yuuki_Taiko/status/1212648352052989953 …", "wayback": "https://web.archive.org/web/20200105010715/https://twitter.com/Yuuki_Taiko/status/1213046731601920000"}, {"id": "1212954798581923841", "date": "2020-01-03T13:32:14.249000+09:00", "text": "マジで嬉しいです！！！\n☆10全良難易度表の地力C初全良、そしてこれで・・・\n☆10全良30譜面達成です！！！！！\nやったぁぁぁぁぁ！！！！！\n全良637譜面目&☆10全良30譜面目・・・\n須佐之男！！！！！！！pic.twitter.com/Yrc61J4HIk", "wayback": "https://web.archive.org/web/20200109192838/https://twitter.com/Yuuki_Taiko/status/1212954798581923841"}, {"id": "1212906358187552768", "date": "2020-01-03T10:19:45.159000+09:00", "text": "ラスゴーのリズム取りづらいところと最後。pic.twitter.com/bzG3cHHTwp", "wayback": "https://web.archive.org/web/20200109195836/https://twitter.com/Yuuki_Taiko/status/1212906358187552768"}, {"id": "1212899083616047104", "date": "2020-01-03T09:50:50.766000+09:00", "text": "は？wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwpic.twitter.com/0LeVDir0QK", "wayback": "https://web.archive.org/web/20200104122039/https://twitter.com/Yuuki_Taiko/status/1212899083616047104"}, {"id": "1212350448608239616", "date": "2020-01-01T21:30:45.987000+09:00", "text": "あと☆10全良次がプロフィールにある目標の30譜面目になるけど何をやろうか迷ってる。pic.twitter.com/hgL4tcpNv7", "wayback": "https://web.archive.org/web/20200113141640/https://twitter.com/Yuuki_Taiko/status/1212350448608239616"}, {"id": "1212345580892151809", "date": "2020-01-01T21:11:25.433000+09:00", "text": "カラミティ表やった後、久しぶりに千鼓千鼓詰めてました。\nそしたら10段受かったときぶりに可3出しました。\nちなみに3つ全部2枚目のエリアだけで出ました。pic.twitter.com/U5bST6o2Rd", "wayback": "https://web.archive.org/web/20200102053303/https://twitter.com/Yuuki_Taiko/status/1212345580892151809"}, {"id": "1212238564995428353", "date": "2020-01-01T14:06:10.855000+09:00", "text": "ハンロックようやくフルコンボ出来ました！！！pic.twitter.com/RG9RyK4u9X", "wayback": "https://web.archive.org/web/20200108172154/https://twitter.com/Yuuki_Taiko/status/1212238564995428353"}, {"id": "1212222068051177473", "date": "2020-01-01T13:00:37.677000+09:00", "text": "2020年最高のスタートを切ることが出来ました！！！\n今年初新規全良を☆10で決めれて嬉しいです！！！\nやったぁぁぁぁぁ！！！！！！！\n全良636譜面目&☆10全良29譜面目・・・\nCalamity Fortune（表）！！！！！！！pic.twitter.com/I9WlXF1gZR", "wayback": "https://web.archive.org/web/20200109031922/https://twitter.com/Yuuki_Taiko/status/1212222068051177473"}, {"id": "1212216414339248128", "date": "2020-01-01T12:38:09.727000+09:00", "text": "今年も一年頑張りますので、よろしくお願いします。\n※900コンボくらいまで全良してました。pic.twitter.com/0w4BV5vL7u", "wayback": "https://web.archive.org/web/20200107110642/https://twitter.com/Yuuki_Taiko/status/1212216414339248128"}, {"id": "1211978568248393728", "date": "2019-12-31T20:53:02.800000+09:00", "text": "#2019年も終わるし最終自己紹介\n京都ドンだーです。\n蒼、翠10段、全良635（☆10→28）譜面で☆7以下制覇（現行・等速）してます。\n2020年も頑張りますのでよろしくお願いします。pic.twitter.com/7U70rURtSn", "wayback": "https://web.archive.org/web/20200108082817/https://twitter.com/Yuuki_Taiko/status/1211978568248393728"}, {"id": "1211967302062657539", "date": "2019-12-31T20:08:16.732000+09:00", "text": "ちなみに去年はこれ。https://twitter.com/Yuuki_Taiko/status/1079573968590274561 …", "wayback": "https://web.archive.org/web/20200105225429/https://twitter.com/Yuuki_Taiko/status/1211967302062657539"}, {"id": "1211967011858763778", "date": "2019-12-31T20:07:07.542000+09:00", "text": "これが今年最後の新規全良でした。\n去年に続いて年の最後の新規全良を☆10で決めれて良かったです！！！https://twitter.com/Yuuki_Taiko/status/1211247122072227840 …", "wayback": "https://web.archive.org/web/20200109123825/https://twitter.com/Yuuki_Taiko/status/1211967011858763778"}, {"id": "1211965538374582272", "date": "2019-12-31T20:01:16.236000+09:00", "text": "叩き納めしてきました。\n小林ときょーじゅセッションありがとう！！！！！\n2020年も頑張ります！！！！！pic.twitter.com/6YjlVjHuwD", "wayback": "https://web.archive.org/web/20200109185641/https://twitter.com/Yuuki_Taiko/status/1211965538374582272"}, {"id": "1211890914794196992", "date": "2019-12-31T15:04:44.588000+09:00", "text": "叩き納め行く", "wayback": "https://web.archive.org/web/20200101122419/https://twitter.com/Yuuki_Taiko/status/1211890914794196992"}, {"id": "1211849799579783168", "date": "2019-12-31T12:21:21.957000+09:00", "text": "某金達人叩いてるツイートが多すぎてそいつ関連のワードほとんどミュートしてるんやけど、未だに流れてきて見ててしんどいからこれ以上そいつ叩きたいんならTLじゃなくてDMでやってほしい。", "wayback": "https://web.archive.org/web/20200110021040/https://twitter.com/Yuuki_Taiko/status/1211849799579783168"}, {"id": "1211593069839015936", "date": "2019-12-30T19:21:12.817000+09:00", "text": "今日は噛み合いませんでした・・・。\n明日は詰める時間あるか分からんので年始になったら再挑戦しようと思います。pic.twitter.com/P31z8smykU", "wayback": "https://web.archive.org/web/20200105205158/https://twitter.com/Yuuki_Taiko/status/1211593069839015936"}, {"id": "1211527834746810368", "date": "2019-12-30T15:01:59.559000+09:00", "text": "とりま一桁フルも出来た。pic.twitter.com/8qxzVwkMWL", "wayback": "https://web.archive.org/web/20200112074659/https://twitter.com/Yuuki_Taiko/status/1211527834746810368"}, {"id": "1211488673042010118", "date": "2019-12-30T12:26:22.681000+09:00", "text": "もういい加減にしてくれマジでpic.twitter.com/o0HoigjHfU", "wayback": "https://web.archive.org/web/20191231001344/https://twitter.com/Yuuki_Taiko/status/1211488673042010118"}, {"id": "1211479447439736832", "date": "2019-12-30T11:49:43.126000+09:00", "text": "コンボ数まで全良やったけど叩き間違えた・・・。pic.twitter.com/pXo4tPE18X", "wayback": "https://web.archive.org/web/20200103122050/https://twitter.com/Yuuki_Taiko/status/1211479447439736832"}, {"id": "1211247122072227840", "date": "2019-12-29T20:26:32.442000+09:00", "text": "最後で何回も散りまくって本当につらかったですが、今日のラスクレラス曲でようやく全良出来ました！！！\n超久しぶりの☆10全良\nマジで嬉しいです！！！\nやったぁぁぁぁぁ！！！！！！！！！\n全良635譜面目&☆10全良28譜面目・・・\nSurf Zapping！！！！！pic.twitter.com/l50btze12A", "wayback": "https://web.archive.org/web/20191229154539/https://twitter.com/Yuuki_Taiko/status/1211247122072227840"}, {"id": "1211246317919338496", "date": "2019-12-29T20:23:20.717000+09:00", "text": "マジで今日諦めずにやってよかったわ・・・。", "wayback": "https://web.archive.org/web/20191230001957/https://twitter.com/Yuuki_Taiko/status/1211246317919338496"}, {"id": "1211111349742268416", "date": "2019-12-29T11:27:01.796000+09:00", "text": "踏んでしまった・・・。\n第1ゴーゴー入る前の低速・・・。pic.twitter.com/V1wuwExHqU", "wayback": "https://web.archive.org/web/20191230092513/https://twitter.com/Yuuki_Taiko/status/1211111349742268416"}, {"id": "1211105247436738560", "date": "2019-12-29T11:02:46.893000+09:00", "text": "さて、やりますか。（ちなみに夢と現実の境界線全良は12回目）pic.twitter.com/MudgUEcNXr", "wayback": "https://web.archive.org/web/20200109073239/https://twitter.com/Yuuki_Taiko/status/1211105247436738560"}, {"id": "1211073890694287360", "date": "2019-12-29T08:58:10.863000+09:00", "text": "そして一番奥に座ってるのが俺wwwwwwwwwwwwwwwwwwwwwwwwwwwwww https://twitter.com/h_taiko3263/status/1211072462718324736 …", "wayback": "https://web.archive.org/web/20200109020816/https://twitter.com/Yuuki_Taiko/status/1211073890694287360"}, {"id": "1210880760468520961", "date": "2019-12-28T20:10:45.029000+09:00", "text": "今日は疲れたんで帰ります。\nここまで詰まりました。\nちなみにこれどっちも前半で出しました･･･。pic.twitter.com/5DHbtk7bng", "wayback": "https://web.archive.org/web/20191229151009/https://twitter.com/Yuuki_Taiko/status/1210880760468520961"}, {"id": "1210800676583833600", "date": "2019-12-28T14:52:31.543000+09:00", "text": "635変えるかも。https://twitter.com/Yuuki_Taiko/status/1209976073384906752 …", "wayback": "https://web.archive.org/web/20191228185850/https://twitter.com/Yuuki_Taiko/status/1210800676583833600"}, {"id": "1210772418773389314", "date": "2019-12-28T13:00:14.356000+09:00", "text": "ちょっと待って！？\nここ入る前まで全良やったwwwwwwwwwwwwwwwwwwpic.twitter.com/TYxHvkHy7C", "wayback": "https://web.archive.org/web/20191228172436/https://twitter.com/Yuuki_Taiko/status/1210772418773389314"}, {"id": "1210753042762461185", "date": "2019-12-28T11:43:14.755000+09:00", "text": "Surf Zappingやっとフルコンボ出来ました！！\nしかも可一桁乗って120万越えての初フルやったからビックリしたわwwwwwwpic.twitter.com/CRF4v8LNER", "wayback": "https://web.archive.org/web/20200106145419/https://twitter.com/Yuuki_Taiko/status/1210753042762461185"}, {"id": "1210729095731920897", "date": "2019-12-28T10:08:05.338000+09:00", "text": "#今年のベストリザルト1枚\n色々悩んだけど、やっぱ600譜面目に決めたこれ。\nこれ決めた日22歳になる前の最後のタイタツやったからこの3日後に\n気持ちよく誕生日むかえることができてマジで良かったと思う。pic.twitter.com/N8jc4dDr4j", "wayback": "https://web.archive.org/web/20191228024938/https://twitter.com/Yuuki_Taiko/status/1210729095731920897"}, {"id": "1210527330398920704", "date": "2019-12-27T20:46:20.734000+09:00", "text": "ドドンガド～ン裏ようやくフルコンボ出来ました！！！\n前半で出しすぎたな・・・。pic.twitter.com/MQtDyWQsc3", "wayback": "https://web.archive.org/web/20191227123509/https://twitter.com/Yuuki_Taiko/status/1210527330398920704"}, {"id": "1210526820119928832", "date": "2019-12-27T20:44:19.074000+09:00", "text": "前詰めた時600コンボ越えてから出たりあってめっちゃドブりましたが、今日出来ました！！！\nこれでバラエティの☆8もおわりです！！\n全良634譜面目\nD絶対！SAMURAIインザレイン（表）！！！！！pic.twitter.com/ucWJXEDM5O", "wayback": "https://web.archive.org/web/20191227152601/https://twitter.com/Yuuki_Taiko/status/1210526820119928832"}, {"id": "1209976073384906752", "date": "2019-12-26T08:15:50.820000+09:00", "text": "今年中にこの2譜面は全良しときたい。\nたぶんこうなるとは思うけど、\n634.D絶対表\n635.天ノ弱\nで行く予定。pic.twitter.com/ibX77l5ey1", "wayback": "https://web.archive.org/web/20191225232632/https://twitter.com/Yuuki_Taiko/status/1209976073384906752"}, {"id": "1209060436533891072", "date": "2019-12-23T19:37:25.983000+09:00", "text": "#ゆいあいばのはたラク2000全良を応援する会\n頑張れ！！！", "wayback": "https://web.archive.org/web/20191223111329/https://twitter.com/Yuuki_Taiko/status/1209060436533891072"}, {"id": "1209047336296435712", "date": "2019-12-23T18:45:22.643000+09:00", "text": "#けいの名人合格を応援する会\n極圏の時も言ったけど、\nけい！ 頑張れ！！！！！", "wayback": "https://web.archive.org/web/20191223200244/https://twitter.com/Yuuki_Taiko/status/1209047336296435712"}, {"id": "1208923466268758017", "date": "2019-12-23T10:33:09.727000+09:00", "text": "フォロワー3400人になりました！！！pic.twitter.com/8F41YCUO8f", "wayback": "https://web.archive.org/web/20191223035726/https://twitter.com/Yuuki_Taiko/status/1208923466268758017"}, {"id": "1208714535252545536", "date": "2019-12-22T20:42:56.691000+09:00", "text": "それと今日はこの曲も全良出来ました！！！\n狙い始めてすぐ全良出来たんで良かったです！！！\n全良633譜面目\n音虫をつかまえろ！！！！！pic.twitter.com/AXgj5K9IjL", "wayback": "https://web.archive.org/web/20191222135620/https://twitter.com/Yuuki_Taiko/status/1208714535252545536"}, {"id": "1208714057731080192", "date": "2019-12-22T20:41:02.841000+09:00", "text": "遅れましたがいぶきさん\n今日はセッションありがとうございます！！！！！pic.twitter.com/1LKpzrc0ul", "wayback": "https://web.archive.org/web/20191222143032/https://twitter.com/Yuuki_Taiko/status/1208714057731080192"}, {"id": "1208596957062500353", "date": "2019-12-22T12:55:43.866000+09:00", "text": "マジで俺の苦手な譜面の詰め合わせって感じでかなり大苦戦しましたがようやく全良出来ました！！！\n水曜に追加された新曲6曲これで全て全良出来ました！！！\nいぇーーい！！！\nそして再びボカロは天ノ弱のみになりました。\n全良632譜面目\n撥条少女時計！！！！！！！pic.twitter.com/7R5t68bpSW", "wayback": "https://web.archive.org/web/20191222060032/https://twitter.com/Yuuki_Taiko/status/1208596957062500353"}, {"id": "1208574974987927552", "date": "2019-12-22T11:28:22.931000+09:00", "text": "あの地帯の前の複合・・・。pic.twitter.com/ED01ajBzwa", "wayback": "https://web.archive.org/web/20191222025901/https://twitter.com/Yuuki_Taiko/status/1208574974987927552"}, {"id": "1208519584396898306", "date": "2019-12-22T07:48:16.785000+09:00", "text": "#ば〜やの金超人を応援する会\nば～や 頑張れ！！！！！", "wayback": "https://web.archive.org/web/20191222000744/https://twitter.com/Yuuki_Taiko/status/1208519584396898306"}, {"id": "1208353420966424577", "date": "2019-12-21T20:48:00.336000+09:00", "text": "やっとラスト前まで全良できたんですけど、ここの1コンボ目でやられました・・・。  \nまた明日頑張ります。pic.twitter.com/E7zDTBEBaK", "wayback": "https://web.archive.org/web/20191221122027/https://twitter.com/Yuuki_Taiko/status/1208353420966424577"}, {"id": "1208312827779284992", "date": "2019-12-21T18:06:42.166000+09:00", "text": "越えた直後で・・・。pic.twitter.com/EvUTPNJFcP", "wayback": "https://web.archive.org/web/20191221092415/https://twitter.com/Yuuki_Taiko/status/1208312827779284992"}, {"id": "1208250677866033152", "date": "2019-12-21T13:59:44.472000+09:00", "text": "あのkd地帯と最後。pic.twitter.com/dYjpSMP47J", "wayback": "https://web.archive.org/web/20191221051207/https://twitter.com/Yuuki_Taiko/status/1208250677866033152"}, {"id": "1208249176905043970", "date": "2019-12-21T13:53:46.615000+09:00", "text": "pic.twitter.com/fMqAeuQpJ6", "wayback": "https://web.archive.org/web/20191221052331/https://twitter.com/Yuuki_Taiko/status/1208249176905043970"}, {"id": "1208161369830252544", "date": "2019-12-21T08:04:51.777000+09:00", "text": "この曲の読み方は分かったんやけど、この6文字の漢字の1文字目が何て打ったら出てくるんか分からへん。\n誰か教えてください。pic.twitter.com/W50AandCyA", "wayback": "https://web.archive.org/web/20191220232327/https://twitter.com/Yuuki_Taiko/status/1208161369830252544"}, {"id": "1207968692006346752", "date": "2019-12-20T19:19:13.804000+09:00", "text": "昨日1回やったら可2出て、で今日2クレで全良出来ました！！！\n全良631譜面目 グラーヴェ！！！pic.twitter.com/p8eiD6Ol1c", "wayback": "https://web.archive.org/web/20191220103502/https://twitter.com/Yuuki_Taiko/status/1207968692006346752"}, {"id": "1207669538680008704", "date": "2019-12-19T23:30:30.093000+09:00", "text": "とりま可一桁乗せることは出来ました。\n2枚目の所くらいまで全良っていうのが1回ありました。\nいずれやりますが、どのタイミングで狙うかはまだ決めてないです。pic.twitter.com/aP3dhMTEEY", "wayback": "https://web.archive.org/web/20191219143536/https://twitter.com/Yuuki_Taiko/status/1207669538680008704"}, {"id": "1207621824722268161", "date": "2019-12-19T20:20:54.199000+09:00", "text": "ホントは天ノ弱を☆8のボカロで一番最後に全良って感じにしたかったけど、少女時計の譜面昨日やってみたらあまりにもムズすぎたから、少女時計を☆8ボカロ最後にすることがほぼ確定した。", "wayback": "https://web.archive.org/web/20191219113031/https://twitter.com/Yuuki_Taiko/status/1207621824722268161"}, {"id": "1207305048583098368", "date": "2019-12-18T23:22:08.882000+09:00", "text": "今日出た新曲の6曲中4曲が☆7以下でなおかつその中にかなりドブったやつもあってめっちゃキツかったですがギリギリ初日に7以下制覇取り戻すことが出来ました！！！\n全良\n627.REAL×EYES\n628.ミルミル～未来ミエル～\n629.OVER THE TOP\n630.馬と鹿pic.twitter.com/8qp9tCfHPv", "wayback": "https://web.archive.org/web/20191218143038/https://twitter.com/Yuuki_Taiko/status/1207305048583098368"}, {"id": "1206572329343410176", "date": "2019-12-16T22:50:35.002000+09:00", "text": "#今年が終わる前にフォロワーさんのフォロワーさんと繋がりたいのでフォロワーさんRTお願いします\n最近は☆8の全良狙いにハマってます。\nこれらは今年特に全良出来て嬉しかった4枚です。pic.twitter.com/pvts3M2PyO", "wayback": "https://web.archive.org/web/20191216201425/https://twitter.com/Yuuki_Taiko/status/1206572329343410176"}, {"id": "1206166211597221888", "date": "2019-12-15T19:56:48.986000+09:00", "text": "無反・多重・チキンなどドブりまくってガチでキツかったですが、今日のラスクレラス曲でついに全良出来ました！！！！！\nやったぜぇぇぇぇ！！！！！\n全良626譜面目\nカナデア！！！！！！！！！pic.twitter.com/FbxJuCkT55", "wayback": "https://web.archive.org/web/20191216051233/https://twitter.com/Yuuki_Taiko/status/1206166211597221888"}, {"id": "1206111285265321984", "date": "2019-12-15T16:18:33.528000+09:00", "text": "アミパラ久御山店でバナパスの落とし物がありました。\nカウンターにて店員さんに保管してもらってるので、心当たりのある方は取りに行ってください。\n出来たらこのツイート拡散してほしいです。pic.twitter.com/DEwhwzRgzf", "wayback": "https://web.archive.org/web/20191216120020/https://twitter.com/Yuuki_Taiko/status/1206111285265321984"}, {"id": "1206071482893385730", "date": "2019-12-15T13:40:23.903000+09:00", "text": "チキってこの点数見たの3回目・・・。pic.twitter.com/feHxUn1hXE", "wayback": "https://web.archive.org/web/20191215234405/https://twitter.com/Yuuki_Taiko/status/1206071482893385730"}, {"id": "1206016622214823937", "date": "2019-12-15T10:02:24.098000+09:00", "text": "12分・・・。pic.twitter.com/9G6jnfEYg8", "wayback": "https://web.archive.org/web/20191216002701/https://twitter.com/Yuuki_Taiko/status/1206016622214823937"}, {"id": "1205836928320278528", "date": "2019-12-14T22:08:21.735000+09:00", "text": "カナデアももうそろそろ全良狙い時やな。pic.twitter.com/096AvW4FKO", "wayback": "https://web.archive.org/web/20191215143451/https://twitter.com/Yuuki_Taiko/status/1205836928320278528"}, {"id": "1205826493999247361", "date": "2019-12-14T21:26:53.999000+09:00", "text": "MATSURI D/Aのここムズすぎてよく可出るし1回しか全良通過してないのヤバいpic.twitter.com/ehIRWljUaZ", "wayback": "https://web.archive.org/web/20191217024402/https://twitter.com/Yuuki_Taiko/status/1205826493999247361"}, {"id": "1205762015693660160", "date": "2019-12-14T17:10:41.173000+09:00", "text": "縁ラッシュの全良通過がほぼ安定してたんでやってみたら全良出来ました！！！！！\n全良625譜面目 豊穣弥生！！！！！pic.twitter.com/QrhDY4UwW3", "wayback": "https://web.archive.org/web/20191214123118/https://twitter.com/Yuuki_Taiko/status/1205762015693660160"}, {"id": "1205421005620989952", "date": "2019-12-13T18:35:38.036000+09:00", "text": "#これを見た人は来年の目標を言う\n・全良700いけたら800\n・☆10全良 30いけたら40\n・☆8以下制覇\n・☆10全良難易度表の個人差C以上の中からどれか1譜面全良する。\n今のところはこれだけ。", "wayback": "https://web.archive.org/web/20191213134858/https://twitter.com/Yuuki_Taiko/status/1205421005620989952"}, {"id": "1205415098732273665", "date": "2019-12-13T18:12:09.724000+09:00", "text": "12分地帯越えてから出たりとかマジで狂ったようにドブりまくって地獄でした・・・。\nでもようやく全良できました！！！！！\nボカロの☆8は天ノ弱だけになりました。\n全良624譜面目\n脳漿炸裂ガール（表）！！！！！pic.twitter.com/m8tgO2wDtN", "wayback": "https://web.archive.org/web/20191213174307/https://twitter.com/Yuuki_Taiko/status/1205415098732273665"}, {"id": "1205381718544277506", "date": "2019-12-13T15:59:31.267000+09:00", "text": "さあさあ狂ったように踊りましょう\n          ↑\nここ・・・。pic.twitter.com/wl0syb74aM", "wayback": "https://web.archive.org/web/20191214095431/https://twitter.com/Yuuki_Taiko/status/1205381718544277506"}, {"id": "1204901614290534402", "date": "2019-12-12T08:11:45.493000+09:00", "text": "#これを見た人は段位と全良数を言う見た人強制\n10段\n全良623（☆10→27）譜面", "wayback": "https://web.archive.org/web/20191212001247/https://twitter.com/Yuuki_Taiko/status/1204901614290534402"}, {"id": "1203620679767117828", "date": "2019-12-08T19:21:46.904000+09:00", "text": "マジで久々の新規☆10フルコンボです・・・。\nドン抜けたりとかが多くてめっちゃかかりましたがようやくGod Rayフルコンボ出来ました！！！！！pic.twitter.com/OVrRbx8Tso", "wayback": "https://web.archive.org/web/20191208102920/https://twitter.com/Yuuki_Taiko/status/1203620679767117828"}, {"id": "1203492357473099776", "date": "2019-12-08T10:51:52.485000+09:00", "text": "昨日正規全良したあと、でたらめやったら「全良行けそうじゃね？」って思ってやったらめっちゃ地獄見ました・・・。\nでも今日全良出来ました！！！\n正規に続いてでたらめ全良も出来てよかったです！！！\n流浪の琥珀姫 でたらめ全良！！！！！！！pic.twitter.com/caC1GUBBQ3", "wayback": "https://web.archive.org/web/20191208052205/https://twitter.com/Yuuki_Taiko/status/1203492357473099776"}, {"id": "1203448306027782144", "date": "2019-12-08T07:56:49.802000+09:00", "text": "昨日God Rayやってたけど、序盤のここでドン1個抜けてそのあとノーミスなのチーンってなった。\nフルコンしたかった・・・。orzpic.twitter.com/spzBhjmdFl", "wayback": "https://web.archive.org/web/20191208002028/https://twitter.com/Yuuki_Taiko/status/1203448306027782144"}, {"id": "1203281671367225344", "date": "2019-12-07T20:54:41.003000+09:00", "text": "pic.twitter.com/NQl4jTMtG6", "wayback": "https://web.archive.org/web/20191207184743/https://twitter.com/Yuuki_Taiko/status/1203281671367225344"}, {"id": "1203260843728625666", "date": "2019-12-07T19:31:55.307000+09:00", "text": "流浪の琥珀姫でたらめもやってみたけど・・・。pic.twitter.com/0jGOuoZUGb", "wayback": "https://web.archive.org/web/20191207112457/https://twitter.com/Yuuki_Taiko/status/1203260843728625666"}, {"id": "1203135599143616512", "date": "2019-12-07T11:14:14.671000+09:00", "text": "よっしゃ！！！\n昨日はドブりまくって出来んかったけど今日はすぐに全良出来ました！！！！！\nこれ好きな曲なんで全良出来てよかったです！！！\n全良623譜面目\n流浪の琥珀姫！！！！！pic.twitter.com/g9iQIUxvRK", "wayback": "https://web.archive.org/web/20191207030054/https://twitter.com/Yuuki_Taiko/status/1203135599143616512"}, {"id": "1202941301055901696", "date": "2019-12-06T22:22:10.397000+09:00", "text": "400コンボ越えてから・・・。pic.twitter.com/Gto1jHokiZ", "wayback": "https://web.archive.org/web/20191206175943/https://twitter.com/Yuuki_Taiko/status/1202941301055901696"}, {"id": "1202912912769073153", "date": "2019-12-06T20:29:22.102000+09:00", "text": "ソライロ初段\nモモイロ初段\nキミドリ7段\nムラサキ5段\nホワイト7段\nレッド9段\nイエロー9段\nブルー10段\nグリーン10段\n\n・・・", "wayback": "https://web.archive.org/web/20191206130338/https://twitter.com/Yuuki_Taiko/status/1202912912769073153"}, {"id": "1202574296196866049", "date": "2019-12-05T22:03:49.620000+09:00", "text": "3回で全良出来ました！！！\nで、7以下制覇も取り戻せました。（n回目）\n全良622譜面目\nNATSU☆しようぜ！！！！！pic.twitter.com/NKsVXP7x2g", "wayback": "https://web.archive.org/web/20191205131854/https://twitter.com/Yuuki_Taiko/status/1202574296196866049"}, {"id": "1201479528620548097", "date": "2019-12-02T21:33:36.690000+09:00", "text": "フォロワー3300人になりました！！！\n沢山のフォローありがとうございます！！！\nこれからも頑張ります！！！pic.twitter.com/Vn8QeEuUHG", "wayback": "https://web.archive.org/web/20191202132900/https://twitter.com/Yuuki_Taiko/status/1201479528620548097"}, {"id": "1201045605801316353", "date": "2019-12-01T16:49:21.428000+09:00", "text": "バラエティの☆8あとD絶対表だけになりました！！！\n全良621譜面目 本能寺の変！！！pic.twitter.com/afVSowzxut", "wayback": "https://web.archive.org/web/20191201080836/https://twitter.com/Yuuki_Taiko/status/1201045605801316353"}, {"id": "1201004225133563904", "date": "2019-12-01T14:04:55.508000+09:00", "text": "ラスゴーの後半前まで全良するのも普通にきつかったですが、ようやく全良出来ました！！！！！\nアレキサンダーに続いてこっちのテーマも全良出来てよかったです！！！\n全良620譜面目\nドクターXのテーマ！！！！！pic.twitter.com/YWkj87AXUz", "wayback": "https://web.archive.org/web/20191201054951/https://twitter.com/Yuuki_Taiko/status/1201004225133563904"}, {"id": "1200945126542983169", "date": "2019-12-01T10:10:05.306000+09:00", "text": "#12月になったので音ゲーマーフォロー祭\n京都でタイタツしてます！\n全良増やし等頑張ります！！！pic.twitter.com/x2cJILb33d", "wayback": "https://web.archive.org/web/20191201012814/https://twitter.com/Yuuki_Taiko/status/1200945126542983169"}, {"id": "1200908557194891265", "date": "2019-12-01T07:44:46.494000+09:00", "text": "#11月の上出来リザルト4枚 \n挑戦全良金合格、☆8初級制覇しました。\nアレキサンダー全良はマジで嬉しかったです！！！\n11月はバリバリ☆8おじさん噛ましてましたwwwwww\n12月も頑張ります！！！pic.twitter.com/2PxO6t2hAn", "wayback": "https://web.archive.org/web/20191130230102/https://twitter.com/Yuuki_Taiko/status/1200908557194891265"}, {"id": "1200775275891441664", "date": "2019-11-30T22:55:09.755000+09:00", "text": "アレキ全良した後は、久しぶりにでたらめやってました。\nどっちもドブりました。\nでたらめ全良\n42.紅蓮華\n43.ダン・ダン・ドゥビ・ズバー！pic.twitter.com/x7Zc18ZMsM", "wayback": "https://web.archive.org/web/20191130164129/https://twitter.com/Yuuki_Taiko/status/1200775275891441664"}, {"id": "1200745524606853122", "date": "2019-11-30T20:56:56.496000+09:00", "text": "しょうたおめでとう！！！！！pic.twitter.com/38hMe5hnbL", "wayback": "https://web.archive.org/web/20191130132432/https://twitter.com/Yuuki_Taiko/status/1200745524606853122"}, {"id": "1200645456914550786", "date": "2019-11-30T14:19:18.499000+09:00", "text": "アレキサンダーの次はこれやるかも。pic.twitter.com/b6oBvHBBx8", "wayback": "https://web.archive.org/web/20191130053743/https://twitter.com/Yuuki_Taiko/status/1200645456914550786"}, {"id": "1200573832915894273", "date": "2019-11-30T09:34:42.007000+09:00", "text": "#2年前の自分に一言\n今俺は全良600譜面越えてるよ！\nあんま無理せずキリ番（全良100譜面目）頑張って\nもしそのやりたいやつ上手くいかんかったら1度妥協してからもう一度地力上げしてある程度付いてからリベンジするのも良い手やからな。", "wayback": "https://web.archive.org/web/20191130004318/https://twitter.com/Yuuki_Taiko/status/1200573832915894273"}, {"id": "1200401543167533058", "date": "2019-11-29T22:10:04.930000+09:00", "text": "マジで可1よりもキツいやつ踏んでしまいました・・・。\nしかもこれdd kkkで抜けたのと無反で起きた不可なの辛い・・・。pic.twitter.com/kzFhbcPoh7", "wayback": "https://web.archive.org/web/20191129140111/https://twitter.com/Yuuki_Taiko/status/1200401543167533058"}, {"id": "1199508476168290304", "date": "2019-11-27T11:01:21.165000+09:00", "text": "今気がついたけど、初めて☆7以下制覇をしてから1年たってた。https://twitter.com/Yuuki_Taiko/status/1066270310897344512 …", "wayback": "https://web.archive.org/web/20191127030453/https://twitter.com/Yuuki_Taiko/status/1199508476168290304"}, {"id": "1198581005738631168", "date": "2019-11-24T21:35:54.983000+09:00", "text": "今日も全良出来ませんでした・・・。\n1回これ2回とも捌ききったとこまで耐えてたんですけど、そのあと緊張して散ったりしたんでマジで悔しいです・・・。\nまた次回頑張ります。pic.twitter.com/ZiBUJ9voNl", "wayback": "https://web.archive.org/web/20191124124452/https://twitter.com/Yuuki_Taiko/status/1198581005738631168"}, {"id": "1198429759463514113", "date": "2019-11-24T11:34:55.061000+09:00", "text": "ヤバい・・・。\nちっとも噛み合わへん・・・。", "wayback": "https://web.archive.org/web/20191124024054/https://twitter.com/Yuuki_Taiko/status/1198429759463514113"}, {"id": "1197864168059064320", "date": "2019-11-22T22:07:27.562000+09:00", "text": "最近全良増やしずっと☆8ばっかだったんで、今日は☆9やりました。\nラスゴー前の難所でめっちゃドブりましたがそこまで初めて全良してそのままゴール出来ました！！！\n全良618譜面目 conflict！！！！！pic.twitter.com/B1v967fLFF", "wayback": "https://web.archive.org/web/20191122131619/https://twitter.com/Yuuki_Taiko/status/1197864168059064320"}, {"id": "1197488908574941185", "date": "2019-11-21T21:16:18.729000+09:00", "text": "外伝①合格した後、リザ撮れませんでしたがこれも合格出来ました！！！\nちなみにドレノ表で不可出してそこから巻き返しました。\n「挑戦！334万点！！」合格！！pic.twitter.com/yUdgyd4i80", "wayback": "https://web.archive.org/web/20191121122042/https://twitter.com/Yuuki_Taiko/status/1197488908574941185"}, {"id": "1197488258487160833", "date": "2019-11-21T21:13:43.736000+09:00", "text": "今日1クレ目のことです。\n驚きましたし、「え？」って思いました。\nやわらか裏で大事故起こしたとき「金は無理やろ」と思いました。\nでも最後まで演奏しました。\nで、演奏終えたらまさかの金合格出来ましたwwwwww\n「チャレンジ！グリーン外伝① 」金合格！！！！！pic.twitter.com/j4cBo51WAi", "wayback": "https://web.archive.org/web/20191121122723/https://twitter.com/Yuuki_Taiko/status/1197488258487160833"}, {"id": "1196918203588329472", "date": "2019-11-20T07:28:32.057000+09:00", "text": "挑戦ドンダフルコンボ合格してみたい。", "wayback": "https://web.archive.org/web/20191119224858/https://twitter.com/Yuuki_Taiko/status/1196918203588329472"}, {"id": "1195627392821186561", "date": "2019-11-16T17:59:18.788000+09:00", "text": "どこでも普通に可出てたし、dddkkk･･･の複合で癖ついたりしてかなり大苦戦しましたがついに全良出来ました！！！！！\n詰める前は出来ると思わなかった曲がこうして全良することが出来てマジで嬉しいです！！！\nやったぁぁぁぁぁ！！！！\n全良616譜面目\nDragon Night！！！！！！！！！pic.twitter.com/1G8R9IHDJs", "wayback": "https://web.archive.org/web/20191116112217/https://twitter.com/Yuuki_Taiko/status/1195627392821186561"}, {"id": "1195572337543806976", "date": "2019-11-16T14:20:32.587000+09:00", "text": "ヤバい・・・。\n癖ついてしまった・・・。", "wayback": "https://web.archive.org/web/20191116061057/https://twitter.com/Yuuki_Taiko/status/1195572337543806976"}, {"id": "1195537195039248384", "date": "2019-11-16T12:00:53.961000+09:00", "text": "1枚目の所で出してからその後全良・・・。pic.twitter.com/8y5fPYabzz", "wayback": "https://web.archive.org/web/20191116031005/https://twitter.com/Yuuki_Taiko/status/1195537195039248384"}, {"id": "1195534274893451264", "date": "2019-11-16T11:49:17.744000+09:00", "text": "24分は1個も出んかったのに・・・。orzpic.twitter.com/BeeU1gABF7", "wayback": "https://web.archive.org/web/20191116032943/https://twitter.com/Yuuki_Taiko/status/1195534274893451264"}, {"id": "1194439911278923777", "date": "2019-11-13T11:20:41.126000+09:00", "text": "#けい極圏全良を応援する会\nけい！頑張れ！！！！", "wayback": "https://web.archive.org/web/20191113084216/https://twitter.com/Yuuki_Taiko/status/1194439911278923777"}, {"id": "1193502876141703168", "date": "2019-11-10T21:17:14.540000+09:00", "text": "あ、載せ忘れてたけど、金達人になったひろととセッションもしました！！！！！\n改めてマジでおめでとう！！！！！pic.twitter.com/hKRkzqJm7K", "wayback": "https://web.archive.org/web/20191110121840/https://twitter.com/Yuuki_Taiko/status/1193502876141703168"}, {"id": "1193462786791051264", "date": "2019-11-10T18:37:56.494000+09:00", "text": "は？wwwwwwwwwwwwwwwpic.twitter.com/4cVnlv3KZE", "wayback": "https://web.archive.org/web/20191110094907/https://twitter.com/Yuuki_Taiko/status/1193462786791051264"}, {"id": "1193386660701990912", "date": "2019-11-10T13:35:26.620000+09:00", "text": "ヤバいwwwwwwwwwwww\nひろとがグリーン達人金合格したwwwwwwwwwwwwwwwwww\nひろとマジでおめでとう！！！！！！！！！pic.twitter.com/esz670F0d2", "wayback": "https://web.archive.org/web/20191110044025/https://twitter.com/Yuuki_Taiko/status/1193386660701990912"}, {"id": "1193385870646099968", "date": "2019-11-10T13:32:18.256000+09:00", "text": "凄いものを見せてもらいました・・・。", "wayback": "https://web.archive.org/web/20191110044129/https://twitter.com/Yuuki_Taiko/status/1193385870646099968"}, {"id": "1193361094334484481", "date": "2019-11-10T11:53:51.123000+09:00", "text": "しょうたがこれ全良したからそれに続こうと思ってやったらめっちゃドブりました・・・。\n最後付近で散ったんが1回あったんでラスト3コンボ入るときめっちゃ緊張しましたが、出来ました！！！\n全良615譜面目\n電車でOPA！OPA！OPA！‐GMT mushup ‐！！！！！pic.twitter.com/Ad7uFhn1uO", "wayback": "https://web.archive.org/web/20191110030603/https://twitter.com/Yuuki_Taiko/status/1193361094334484481"}, {"id": "1193348847658885120", "date": "2019-11-10T11:05:11.288000+09:00", "text": "655コンボ目・・・。pic.twitter.com/Puz7StEeq0", "wayback": "https://web.archive.org/web/20191110021841/https://twitter.com/Yuuki_Taiko/status/1193348847658885120"}, {"
