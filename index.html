ayback": "https://web.archive.org/web/20191104111258/https://twitter.com/Yuuki_Taiko/status/1191310881302306816"}, {"id": "1190923420051001344", "date": "2019-11-03T18:27:24.284000+09:00", "text": "ビバの左縁の無反にめっちゃ悩まされてえげつないくらいドブりました・・・。\nでもそんな中でも全良出来て良かったです！！！\n全良607譜面目\n月下美人（玄人譜面）！！！！！pic.twitter.com/UvFramHzhN", "wayback": "https://web.archive.org/web/20191103093046/https://twitter.com/Yuuki_Taiko/status/1190923420051001344"}, {"id": "1190570605642272768", "date": "2019-11-02T19:05:26.774000+09:00", "text": "☆8初級の残りが全部\n四字熟語譜面分岐シリーズになったのオモろい。\nまずは初級制覇頑張ってみます！！！pic.twitter.com/o2FJOAZr9d", "wayback": "https://web.archive.org/web/20191102102725/https://twitter.com/Yuuki_Taiko/status/1190570605642272768"}, {"id": "1190516889417465856", "date": "2019-11-02T15:31:59.828000+09:00", "text": "え！？wwwwww\n午前中めっちゃドブってたのに\n遅めの昼ごはん食べてからから帰ってきて1クレ目で全良出来たwwwwwwwwwwww\nそしてこの全良で現行収録のアニメ☆8全曲全良出来ました！！！！！\nいぇーーーーい！！！\n全良606譜面目\n未来はジョー！ジョー！！！！！！pic.twitter.com/4H5wneTaSd", "wayback": "https://web.archive.org/web/20191102063504/https://twitter.com/Yuuki_Taiko/status/1190516889417465856"}, {"id": "1190500049492463618", "date": "2019-11-02T14:25:04.877000+09:00", "text": "デュエマの代わりにやったこれ \nちょっとドブりましたが、全良出来ました！！！！！\nこれでアニメの☆8は「未来はジョー！ジョー！」だけです。\n全良605譜面目\nめざせポケモンマスター‐20th Anniversary‐（裏）！！！！！pic.twitter.com/GqKX0UCtQA", "wayback": "https://web.archive.org/web/20191102052957/https://twitter.com/Yuuki_Taiko/status/1190500049492463618"}, {"id": "1190475969397526528", "date": "2019-11-02T12:49:23.735000+09:00", "text": "仲間を増やして次の街へ行く前に出して、そこから最後のkkkkで3つ出た。pic.twitter.com/1vrNzpnmn5", "wayback": "https://web.archive.org/web/20191102035617/https://twitter.com/Yuuki_Taiko/status/1190475969397526528"}, {"id": "1190472769605001216", "date": "2019-11-02T12:36:40.845000+09:00", "text": "おいwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwpic.twitter.com/WUG1G8dlTE", "wayback": "https://web.archive.org/web/20191102034121/https://twitter.com/Yuuki_Taiko/status/1190472769605001216"}, {"id": "1190467720606650369", "date": "2019-11-02T12:16:37.070000+09:00", "text": "難所繋がらんようになったから一回やめる。", "wayback": "https://web.archive.org/web/20191102033424/https://twitter.com/Yuuki_Taiko/status/1190467720606650369"}, {"id": "1190449848639614976", "date": "2019-11-02T11:05:36.061000+09:00", "text": "は？あの難所全良したのに・・・。pic.twitter.com/XWYfkY8FxY", "wayback": "https://web.archive.org/web/20191102021837/https://twitter.com/Yuuki_Taiko/status/1190449848639614976"}, {"id": "1190447923701510144", "date": "2019-11-02T10:57:57.120000+09:00", "text": "ほぼ全部2枚目の所で出たのヤバい。pic.twitter.com/Hkr1WKveB5", "wayback": "https://web.archive.org/web/20191102021015/https://twitter.com/Yuuki_Taiko/status/1190447923701510144"}, {"id": "1190419306456088576", "date": "2019-11-02T09:04:14.237000+09:00", "text": "☆8 現状\n赤が全良済みです。pic.twitter.com/I4UKakssWs", "wayback": "https://web.archive.org/web/20191102002001/https://twitter.com/Yuuki_Taiko/status/1190419306456088576"}, {"id": "1190407978039406593", "date": "2019-11-02T08:19:13.332000+09:00", "text": "#11月になったので音ゲーマーフォロー祭\n京都ドンだーです。\n蒼・翠10段（復活白・黄10段）\n全良604譜面（☆10→27）、現行収録☆7以下制覇してます。\n全良増やし等頑張ります！！！pic.twitter.com/RkoRiuQufv", "wayback": "https://web.archive.org/web/20191101233229/https://twitter.com/Yuuki_Taiko/status/1190407978039406593"}, {"id": "1190217773378457600", "date": "2019-11-01T19:43:25.007000+09:00", "text": "それと今日は久々にでたらめ全良もしました！！！\n黒い猫の歌ちょっとドブりました。\nこの2曲がサヨナラになると聞いたんで、サヨナラ前にでたらめ全良することが出来て良かったです！！！\nでたらめ全良\n40.crossing field\n41.黒い猫の歌pic.twitter.com/sz078OthkQ", "wayback": "https://web.archive.org/web/20191101104655/https://twitter.com/Yuuki_Taiko/status/1190217773378457600"}, {"id": "1190214985097437184", "date": "2019-11-01T19:32:20.229000+09:00", "text": "4つの24+16分と道中が全然噛み合わんくてめっちゃドブりました・・・。\nでもようやく出来ました！！！\nそしてこれでグリーン初段～5段まで全部理論値全良になりました！！！！！\nいぇーーーーい！！！\n全良604譜面目\nナックルヘッズ！！！！！！！pic.twitter.com/ML0wjn1C6e", "wayback": "https://web.archive.org/web/20191101104742/https://twitter.com/Yuuki_Taiko/status/1190214985097437184"}, {"id": "1189103729233891328", "date": "2019-10-29T17:56:36.185000+09:00", "text": "あとこのツイートスクショしたの俺なのヤバい。https://twitter.com/Drum_Monsteer/status/1189099038848667649 …", "wayback": "https://web.archive.org/web/20191029085948/https://twitter.com/Yuuki_Taiko/status/1189103729233891328"}, {"id": "1188743375270203392", "date": "2019-10-28T18:04:41.105000+09:00", "text": "#10月の上出来リザルト\n全良 594→603（+9）\n☆10全良 24→27（+3）\n誕生日前に全良600譜面を決めることができたし、その後復活！イエロー10段も合格することが出来て良かったです！！！\n来月も頑張ります。pic.twitter.com/wEs9vCOrbg", "wayback": "https://web.archive.org/web/20191028094023/https://twitter.com/Yuuki_Taiko/status/1188743375270203392"}, {"id": "1188408079496269826", "date": "2019-10-27T19:52:20.363000+09:00", "text": "ちなみにこれ全良出来たらグリーン初段～5段まで全部理論値全良になります。https://twitter.com/Yuuki_Taiko/status/1188385669573267456 …", "wayback": "https://web.archive.org/web/20191027110310/https://twitter.com/Yuuki_Taiko/status/1188408079496269826"}, {"id": "1188385669573267456", "date": "2019-10-27T18:23:17.421000+09:00", "text": "は？pic.twitter.com/YPfXfsJX3c", "wayback": "https://web.archive.org/web/20191027092458/https://twitter.com/Yuuki_Taiko/status/1188385669573267456"}, {"id": "1188313471261110272", "date": "2019-10-27T13:36:24.002000+09:00", "text": "22歳になってから初めての新規全良です！！！\n中盤でめっちゃドブりました。\n全良603譜面目\nThe Magician's Dream！！！！！pic.twitter.com/8HRUXyshKV", "wayback": "https://web.archive.org/web/20191027044006/https://twitter.com/Yuuki_Taiko/status/1188313471261110272"}, {"id": "1188283966177964032", "date": "2019-10-27T11:39:09.442000+09:00", "text": "ひとまず\nCalamity Fortune表\nフルコンボ出来ました！！！！！pic.twitter.com/rEIHzuFN0r", "wayback": "https://web.archive.org/web/20191027024555/https://twitter.com/Yuuki_Taiko/status/1188283966177964032"}, {"id": "1188278158849560576", "date": "2019-10-27T11:16:04.867000+09:00", "text": "いまだに未フル・・・。pic.twitter.com/B3PCGuftgl", "wayback": "https://web.archive.org/web/20191027023118/https://twitter.com/Yuuki_Taiko/status/1188278158849560576"}, {"id": "1188013245514145792", "date": "2019-10-26T17:43:24.606000+09:00", "text": "きたさいたま2000フルコンボ出来ました！！！！！\n700コンボ越えてからの所なかなか追いつかんくて何回もフル逃してましたが、今日やっと出来ました！！！pic.twitter.com/FX8umrXq1t", "wayback": "https://web.archive.org/web/20191026084600/https://twitter.com/Yuuki_Taiko/status/1188013245514145792"}, {"id": "1187945339904385031", "date": "2019-10-26T13:13:34.647000+09:00", "text": "ノーグラ全良してから合格してみたいと思ってやりました。\nそつおめ2ばんでえげつない事故起こしてからその後緊張してめっちゃ怖かったですが無事合格出来ました！！！\nいぇーーーーい！！！\n太鼓の達人 グリーンver.\n「復活！イエロー10段」合格！！！！！！！！！pic.twitter.com/qgHbNImQ6u", "wayback": "https://web.archive.org/web/20191026041825/https://twitter.com/Yuuki_Taiko/status/1187945339904385031"}, {"id": "1187938362675482625", "date": "2019-10-26T12:45:51.146000+09:00", "text": "D's10台乗ってから受けてみました。\nそしたら、いきなり3曲目まで行けました。\nでもkkk（24分）+dkdkkkdkd（16分）で落ちました・・・。\n頑張ります！！！pic.twitter.com/HlDKO8hhuE", "wayback": "https://web.archive.org/web/20191026034753/https://twitter.com/Yuuki_Taiko/status/1187938362675482625"}, {"id": "1187930415320813568", "date": "2019-10-26T12:14:16.349000+09:00", "text": "DAN20台のったけど不可多いから、減らしてから受けてみる。pic.twitter.com/0gq3HIIYqg", "wayback": "https://web.archive.org/web/20191026032335/https://twitter.com/Yuuki_Taiko/status/1187930415320813568"}, {"id": "1187890046759665664", "date": "2019-10-26T09:33:51.734000+09:00", "text": "これ☆10でそろそろ決着つけたいなと思ってるやつの1個やけど、\n今何でこれ1（1）踏めたんか分からへんくらい苦手譜面なんヤバい。pic.twitter.com/yIKyUcVRyx", "wayback": "https://web.archive.org/web/20191026004000/https://twitter.com/Yuuki_Taiko/status/1187890046759665664"}, {"id": "1187851792459030528", "date": "2019-10-26T07:01:51.198000+09:00", "text": "【しばらく固定用】\n#10月ももうすぐ終わるので音ゲーマーフォロー祭\n京都ドンだーです。\n蒼・翠10段\n全良600↑（☆10→27）、☆7以下制覇（現行）してます。\n復活イエロー10段ゆっくり狙っていきます。pic.twitter.com/VyZs6DuHDU", "wayback": "https://web.archive.org/web/20191025221533/https://twitter.com/Yuuki_Taiko/status/1187851792459030528"}, {"id": "1187672502505336833", "date": "2019-10-25T19:09:25.142000+09:00", "text": "#いいねの数だけ思い出の曲を言う", "wayback": "https://web.archive.org/web/20191025101802/https://twitter.com/Yuuki_Taiko/status/1187672502505336833"}, {"id": "1187332591709372416", "date": "2019-10-24T20:38:44.093000+09:00", "text": "イキリト\nてんぢく2000\nprincess of donderhttps://twitter.com/karinto_0427/status/1187329984160915456 …", "wayback": "https://web.archive.org/web/20191024114250/https://twitter.com/Yuuki_Taiko/status/1187332591709372416"}, {"id": "1186994202963365888", "date": "2019-10-23T22:14:05.929000+09:00", "text": "#引用リツイートで私を貴方のフォロワーさんに紹介してください", "wayback": "https://web.archive.org/web/20191023133930/https://twitter.com/Yuuki_Taiko/status/1186994202963365888"}, {"id": "1186988437968080897", "date": "2019-10-23T21:51:11.447000+09:00", "text": "ノーグラ全良してからやろうかどうかかなり悩んでたんですが\n復活イエロー10段合格頑張ってみようと思います。\n理論値は39（1）-0-13（2）です。\nDANをもうちょっと減らしてから挑んでみようと思います。\nちなみにノーグラ以外の2枚は今日出した記録です。pic.twitter.com/TGR4DqCAyO", "wayback": "https://web.archive.org/web/20191023132427/https://twitter.com/Yuuki_Taiko/status/1186988437968080897"}, {"id": "1186936116693176320", "date": "2019-10-23T18:23:17.083000+09:00", "text": "今年の誕生日は自分の一番大好きなこの曲を全良してきました！！！（11回目の全良）\nてかこれ全良したのかなり久しぶりなんだがwwwwwwwwwpic.twitter.com/YZf90Qa6zy", "wayback": "https://web.archive.org/web/20191023125233/https://twitter.com/Yuuki_Taiko/status/1186936116693176320"}, {"id": "1186659286337777664", "date": "2019-10-23T00:03:15.583000+09:00", "text": "誕生日です！！！\n22歳になりました！！！pic.twitter.com/wqMJi1yEBp", "wayback": "https://web.archive.org/web/20191022173005/https://twitter.com/Yuuki_Taiko/status/1186659286337777664"}, {"id": "1186240098821533697", "date": "2019-10-21T20:17:33.491000+09:00", "text": "全良ツイートで300いいね越えたの初めてなんでマジで嬉しいです！！！\nたくさんのふぁぼ、RT、おめリプ\n本当にありがとうございます！！！！！！！https://twitter.com/Yuuki_Taiko/status/1185799577133170688 …", "wayback": "https://web.archive.org/web/20191021200328/https://twitter.com/Yuuki_Taiko/status/1186240098821533697"}, {"id": "1185878907897016322", "date": "2019-10-20T20:22:18.864000+09:00", "text": "No Gravity決まった後・・・。\n☆7以下制覇も取り戻せました！！！\nこれで気持ちよく3日後の誕生日を迎えることが出来ます！！！！！\nいぇーーい！！！！！！！\n全良\n601.君はロックを聴かない\n602.ナンセンス文学pic.twitter.com/PRPveYCFMT", "wayback": "https://web.archive.org/web/20191020112818/https://twitter.com/Yuuki_Taiko/status/1185878907897016322"}, {"id": "1185799577133170688", "date": "2019-10-20T15:07:04.936000+09:00", "text": "ついにやりました・・・！！！\n全良600譜面達成だぁぁぁぁぁ！！！！！！！！！\nやったぁぁぁぁぁぁぁぁぁぁぁ！！！！！！！！！\n全良600譜面目&☆10全良27譜面目・・・\nNo Gravity！！！！！！！！！pic.twitter.com/Pt6TochbhG", "wayback": "https://web.archive.org/web/20191020061319/https://twitter.com/Yuuki_Taiko/status/1185799577133170688"}, {"id": "1185798353944109056", "date": "2019-10-20T15:02:13.305000+09:00", "text": "ヤバい", "wayback": "https://web.archive.org/web/20191020061236/https://twitter.com/Yuuki_Taiko/status/1185798353944109056"}, {"id": "1185747387341398017", "date": "2019-10-20T11:39:41.920000+09:00", "text": "昨日と違う叩き方にしてみたら・・・。pic.twitter.com/GELttngalV", "wayback": "https://web.archive.org/web/20191020032042/https://twitter.com/Yuuki_Taiko/status/1185747387341398017"}, {"id": "1185692077583040518", "date": "2019-10-20T07:59:55.046000+09:00", "text": "あとこれ。\n872コンボぐらいからあんま可出んかったし、いつも叩ける複合で不可出したのガチでもったいない。pic.twitter.com/Xo8xnc6x0B", "wayback": "https://web.archive.org/web/20191019231630/https://twitter.com/Yuuki_Taiko/status/1185692077583040518"}, {"id": "1185691219713638400", "date": "2019-10-20T07:56:30.514000+09:00", "text": "昨日はずっとここでやられてました・・・。\nちなみに2枚目の4（1）全部この中でした・・・。pic.twitter.com/WpdWXnk7zT", "wayback": "https://web.archive.org/web/20191020002434/https://twitter.com/Yuuki_Taiko/status/1185691219713638400"}, {"id": "1184607059561439232", "date": "2019-10-17T08:08:26.591000+09:00", "text": "☆7以下あるけど次600譜面目やからNo Gravity終わってからやる。", "wayback": "https://web.archive.org/web/20191016232252/https://twitter.com/Yuuki_Taiko/status/1184607059561439232"}, {"id": "1184382802302627841", "date": "2019-10-16T17:17:19.494000+09:00", "text": "#これを見たドンだーは自分の称号を言う\n頂に 至りて挑む 景色かな", "wayback": "https://web.archive.org/web/20191016082046/https://twitter.com/Yuuki_Taiko/status/1184382802302627841"}, {"id": "1183730416395542530", "date": "2019-10-14T22:04:58.573000+09:00", "text": "ゆいあいばマジで名人頑張れ・・・！！！", "wayback": "https://web.archive.org/web/20191014132124/https://twitter.com/Yuuki_Taiko/status/1183730416395542530"}, {"id": "1183691455312744449", "date": "2019-10-14T19:30:09.527000+09:00", "text": "今日は帰ります。\n本当に悔しいです・・・。 \nここ叩ききれば全良600譜面達成でした・・・。\nまた次回頑張ります。pic.twitter.com/dUSl2NHyzr", "wayback": "https://web.archive.org/web/20191014103756/https://twitter.com/Yuuki_Taiko/status/1183691455312744449"}, {"id": "1183322284955561984", "date": "2019-10-13T19:03:12.455000+09:00", "text": "10段受かったときから思ってたんやけど、マジでむっくん合格してからその上の段位の課題曲の理論値詰まるペース速すぎやろwwwwwwwwwwwwwww", "wayback": "https://web.archive.org/web/20191013102243/https://twitter.com/Yuuki_Taiko/status/1183322284955561984"}, {"id": "1183311509453078530", "date": "2019-10-13T18:20:23.375000+09:00", "text": "【全良600譜面決まるまで固定用（改訂版）】\n京都ドンだーです。\n蒼、翠10段で、全良599譜面（☆10→26）、☆7以下制覇してます。\n600譜面目にしようとしてるNo Gravityついに可1踏みました。\nようやくここまでこれたのでマジで頑張ります。pic.twitter.com/qGLTz6nFzG", "wayback": "https://web.archive.org/web/20191013123327/https://twitter.com/Yuuki_Taiko/status/1183311509453078530"}, {"id": "1183294660149563397", "date": "2019-10-13T17:13:26.188000+09:00", "text": "pic.twitter.com/ANVJ2CYUpT", "wayback": "https://web.archive.org/web/20191013091911/https://twitter.com/Yuuki_Taiko/status/1183294660149563397"}, {"id": "1183240260311846912", "date": "2019-10-13T13:37:16.256000+09:00", "text": "は？wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwpic.twitter.com/SKfbyDzatU", "wayback": "https://web.archive.org/web/20191013064220/https://twitter.com/Yuuki_Taiko/status/1183240260311846912"}, {"id": "1183225971081535488", "date": "2019-10-13T12:40:29.438000+09:00", "text": "高速&低速地帯越えてから出したり、チキン3回も踏んでかなりドブりましたが無事全良出来ました！！！\nそしてついにここまで来ました・・・。\n全良599譜面目\nExtreme MGG★★★（裏）！！！！\n次は全良600譜面目です・・・。\n頑張ります！！！pic.twitter.com/NOq59pDkuw", "wayback": "https://web.archive.org/web/20191013054106/https://twitter.com/Yuuki_Taiko/status/1183225971081535488"}, {"id": "1183218001224454145", "date": "2019-10-13T12:08:49.276000+09:00", "text": "高速&低速地帯越えてから・・・。pic.twitter.com/B2C48rz7cM", "wayback": "https://web.archive.org/web/20191013053544/https://twitter.com/Yuuki_Taiko/status/1183218001224454145"}, {"id": "1183192662867759104", "date": "2019-10-13T10:28:08.141000+09:00", "text": "てか俺のFF今月誕生日の人多いなwwwwww\nちなみに俺は23日やけど。\nどれくらいおるんやろ？", "wayback": "https://web.archive.org/web/20191013230147/https://twitter.com/Yuuki_Taiko/status/1183192662867759104"}, {"id": "1183163011793485826", "date": "2019-10-13T08:30:18.774000+09:00", "text": "代行するorしない\nそこは個人の自由なんやけど、\n代行して貰ったのにその地位を利用してマウント取ったりイキり発言するのはガチでダサいからなhttps://twitter.com/mukkundes/status/1183159463215108099 …", "wayback": "https://web.archive.org/web/20191013051310/https://twitter.com/Yuuki_Taiko/status/1183163011793485826"}, {"id": "1182903126166081536", "date": "2019-10-12T15:17:37.212000+09:00", "text": "そしてセイクリッドに続いてこれも全良出来ました！！！！\n今日だけで2譜面両方全良することが出来てマジで嬉しいです！！！\nやったぁぁぁぁぁ！！！！！！！\n全良598譜面目&☆10全良26譜面目・・・\nピコピコ ルイン（裏）！！！！！！pic.twitter.com/9fH4qMsS9d", "wayback": "https://web.archive.org/web/20191012061809/https://twitter.com/Yuuki_Taiko/status/1182903126166081536"}, {"id": "1182878764276994048", "date": "2019-10-12T13:40:48.885000+09:00", "text": "やった！！！！\n初フルで可一桁乗ってから全良候補にしてましたが、全良出来ました！！！！\n600譜面やる前に1つ☆10全良が出来て良かったです！！！！\n全良597譜面目&☆10全良25譜面目\nセイクリッド ルイン（裏）！！！！！！！pic.twitter.com/VCrIkWP7nt", "wayback": "https://web.archive.org/web/20191012044840/https://twitter.com/Yuuki_Taiko/status/1182878764276994048"}, {"id": "1182850367370846208", "date": "2019-10-12T11:47:58.535000+09:00", "text": "うわあああああああああああああああああああorzpic.twitter.com/xAqSJCk8Rk", "wayback": "https://web.archive.org/web/20191012025559/https://twitter.com/Yuuki_Taiko/status/1182850367370846208"}, {"id": "1182847630608437248", "date": "2019-10-12T11:37:06.040000+09:00", "text": "700コンボくらいまで全良・・・。pic.twitter.com/f46g1v2W0W", "wayback": "https://web.archive.org/web/20191012024811/https://twitter.com/Yuuki_Taiko/status/1182847630608437248"}, {"id": "1182837435543080961", "date": "2019-10-12T10:56:35.347000+09:00", "text": "2個マジでもったいないとこで出した。pic.twitter.com/aUdt32QYzh", "wayback": "https://web.archive.org/web/20191012021303/https://twitter.com/Yuuki_Taiko/status/1182837435543080961"}, {"id": "1182259871648899072", "date": "2019-10-10T20:41:33.384000+09:00", "text": "俺来た瞬間全良したのヤバすぎだろwwwwwwwwwpic.twitter.com/ttAIlj5svS", "wayback": "https://web.archive.org/web/20191010120925/https://twitter.com/Yuuki_Taiko/status/1182259871648899072"}, {"id": "1181541756346589185", "date": "2019-10-08T21:08:01.354000+09:00", "text": "もし全良出来そうな☆9以下の曲が無くて、☆10やりたいってなったら、600譜面目やる前にこの2譜面狙いに行くと思う。pic.twitter.com/nsXoGPynUO", "wayback": "https://web.archive.org/web/20191008121836/https://twitter.com/Yuuki_Taiko/status/1181541756346589185"}, {"id": "1181176190607822849", "date": "2019-10-07T20:55:23.690000+09:00", "text": "今日1クレだけやってみたら2回目でピコピコルイン裏フルコンボ出来ました！！！\n昨日のセイクリッド裏に続いてこれも可一桁でフルコンボ出来て良かったです！！！（本当は昨日終わらせたかったんだけどねwww）pic.twitter.com/h88zQ3jNTA", "wayback": "https://web.archive.org/web/20191007121310/https://twitter.com/Yuuki_Taiko/status/1181176190607822849"}, {"id": "1180816978140811264", "date": "2019-10-06T21:08:00.764000+09:00", "text": "それと\nセイクリッドルイン裏 可一桁でフルコンボ出来ました！！！\nそれと2枚目はフルする前の出来事です・・・。\nこの時ミスるまで可1でしかもその1個めっちゃ簡単な所で可出してました・・・。pic.twitter.com/j6MubADAqs", "wayback": "https://web.archive.org/web/20191006121345/https://twitter.com/Yuuki_Taiko/status/1180816978140811264"}, {"id": "1180815290642268160", "date": "2019-10-06T21:01:18.433000+09:00", "text": "第2ゴーゴーの前の複合詰める前も不可がよく出ててガチで苦手譜面やったし、今日はそこ越えても何回も多重と無反地獄に苦しめられてましたが、ようやく全良出来ました！！！\n苦手譜面がまた1つ全良出来て良かったです！！！\n全良596譜面目\n華蕾夢ミル狂詩曲～魂ノ導～（裏）！！！pic.twitter.com/D2Pp8WdXyj", "wayback": "https://web.archive.org/web/20191006120527/https://twitter.com/Yuuki_Taiko/status/1180815290642268160"}, {"id": "1180641499408560130", "date": "2019-10-06T09:30:43.374000+09:00", "text": "【全良600譜面決まるまで固定】\n京都ドンだーです。\n全良595譜面（☆10→24・☆7以下制覇（現行））、蒼・翠10段です。\n全良600譜面とNo Gravity全良頑張ります。pic.twitter.com/ICZMim3rvV", "wayback": "https://web.archive.org/web/20191006004123/https://twitter.com/Yuuki_Taiko/status/1180641499408560130"}, {"id": "1180634766455922688", "date": "2019-10-06T09:03:58.113000+09:00", "text": "今は自分に出来ることからやっていきたいと思ったんで決めました。\nまずは全良600譜面から達成しようと思います。\n玄人狙いはこの目標を達成してから少しずつ考えてみようと思います。", "wayback": "https://web.archive.org/web/20191006000837/https://twitter.com/Yuuki_Taiko/status/1180634766455922688"}, {"id": "1180633060552765440", "date": "2019-10-06T08:57:11.394000+09:00", "text": "そういや昨日No Gravity121万乗ったのに今日の7時になってもランキングが更新されへんのなんでやろ思ったらこれが原因やったんか・・・。pic.twitter.com/YusCq18xgm", "wayback": "https://web.archive.org/web/20191006000026/https://twitter.com/Yuuki_Taiko/status/1180633060552765440"}, {"id": "1180435030679490560", "date": "2019-10-05T19:50:17.393000+09:00", "text": "そういやノーグラやる前にこれ全良出来ました！！！\n特に最初でよく出てましたし、そこ越えても中盤で散ったりしましたし、最後の単音めっちゃ緊張しましたが全良出来ました！！！\n全良595譜面目\nタベテモタベテモ！！！！pic.twitter.com/IdT2gonUfS", "wayback": "https://web.archive.org/web/20191005110637/https://twitter.com/Yuuki_Taiko/status/1180435030679490560"}, {"id": "1180414630264360961", "date": "2019-10-05T18:29:13.555000+09:00", "text": "No Gravity 可4、そして121万乗ってフルコンボ出来ました！！！\nこの時は2枚目の場所全良しました！！！\nあと2枚目の所の前の複合で間違えるまで全良とかあったんで全良頑張ってみます！！！\nやるとしたら600譜面目かな・・・。気分次第でそれより前でやるかもしれへんけど。pic.twitter.com/tdqgJgloJG", "wayback": "https://web.archive.org/web/20191005095302/https://twitter.com/Yuuki_Taiko/status/1180414630264360961"}, {"id": "1178972122594435072", "date": "2019-10-01T18:57:12.926000+09:00", "text": "#10月になったので音ゲーマーフォロー祭\n全良594譜面（☆10→24、☆7以下制覇）、蒼・翠10段の京都ドンです。\n玄人と全良600譜面を目指してます。\nあとこないだ3（2）踏んだNo Gravity全良頑張ってみようと思います。pic.twitter.com/dz1PWtRHzK", "wayback": "https://web.archive.org/web/20191001095934/https://twitter.com/Yuuki_Taiko/status/1178972122594435072"}, {"id": "1178442465939820544", "date": "2019-09-30T07:52:32.939000+09:00", "text": "それと、朝起きたらフォロワー3000人になりました！！！！\nたくさんのフォロー本当にありがとうございます！！！！pic.twitter.com/HnHY8fghF6", "wayback": "https://web.archive.org/web/20190929225713/https://twitter.com/Yuuki_Taiko/status/1178442465939820544"}, {"id": "1178441516328480769", "date": "2019-09-30T07:48:46.534000+09:00", "text": "#9月の上出来リザルト\n全良589→594\n今月は玄人の曲詰めたり色んな☆10触れたりしてたんで、全良5譜面だけでした。\nしかし、☆10の一桁乗った譜面が増えました。\n来月も頑張ります。pic.twitter.com/DX1LCmQPK1", "wayback": "https://web.archive.org/web/20190929225322/https://twitter.com/Yuuki_Taiko/status/1178441516328480769"}, {"id": "1178265560473145344", "date": "2019-09-29T20:09:35.389000+09:00", "text": "今日は☆10で一桁乗った譜面が2個ありました。\n超苦手譜面のNo Gravity可一桁でフルコンボ出来ました！！！！\nと思ったら次のプレイで3（2）出て流石にビビりましたwwwwwwwwwwwwwwwpic.twitter.com/JYb2epEszO", "wayback": "https://web.archive.org/web/20190929111258/https://twitter.com/Yuuki_Taiko/status/1178265560473145344"}, {"id": "1178172957840920576", "date": "2019-09-29T14:01:37.201000+09:00", "text": "玄人の曲なかなか詰まらないんで、色んな☆10触れてみました。\nそしたら結構前フル狙ってみて出来んかった頂をようやくフルコンボ出来ました！！！ \nあとフルするちょっと前に不可ありの可一桁も踏みました。pic.twitter.com/IeFqmgfaFf", "wayback": "https://web.archive.org/web/20190929051259/https://twitter.com/Yuuki_Taiko/status/1178172957840920576"}, {"id": "1177874036367360000", "date": "2019-09-28T18:13:48.768000+09:00", "text": "回数ヤバいですし、撮り忘れまたやらかしてしまいましたが、ようやく理論値1曲目通過出来るまで減らせることが出来ました・・・。\nでもまだまだなんで、もう少し減らせれるよう頑張ります！！！pic.twitter.com/UpzScAmhhx", "wayback": "https://web.archive.org/web/20190928092645/https://twitter.com/Yuuki_Taiko/status/1177874036367360000"}, {"id": "1177530798229966848", "date": "2019-09-27T19:29:54.419000+09:00", "text": "#9月も終わるので音ゲーマーフォロー祭\n京都ドンです。\n全良594（☆10→24）譜面、現行収録☆7以下制覇してます。\n今の目標は玄人取ることと全良600譜面到達です。\n頑張ります！！！pic.twitter.com/i2DfdbEN1R", "wayback": "https://web.archive.org/web/20190927104654/https://twitter.com/Yuuki_Taiko/status/1177530798229966848"}, {"id": "1175739167554195457", "date": "2019-09-22T20:50:36.379000+09:00", "text": "あとNoiz詰める前なんですけど、金曜からやっててえげつないほどドブってたこの曲ようやく全良出来ました！！！\ntakuさんとの挑戦状\n今日中にギリギリ間に合ってマジで良かったです！！！\n全良594譜面目\nBLUE TOPAZ！！！！！pic.twitter.com/NM2W2Vm6tM", "wayback": "https://web.archive.org/web/20190922115916/https://twitter.com/Yuuki_Taiko/status/1175739167554195457"}, {"id": "1175737404637900800", "date": "2019-09-22T20:43:36.067000+09:00", "text": "この時点でももう回数ヤバいですが、Doom Noizようやく可一桁乗ってフルコンボすることが出来ました！！！！！\nあとこの時じゃないですけど580コンボくらいまで全良っていうのもありました。pic.twitter.com/JFDWSXZY8V", "wayback": "https://web.archive.org/web/20190922115859/https://twitter.com/Yuuki_Taiko/status/1175737404637900800"}, {"id": "1175566699887652864", "date": "2019-09-22T09:25:16.883000+09:00", "text": "昨日夜出直して、神楽詰めてたんやけど可3つ減ったけど不可・・・。\n200コンボ近くの複合がマジでまともに繋げれへん・・・。pic.twitter.com/pfnFVc7stN", "wayback": "https://web.archive.org/web/20190922010351/https://twitter.com/Yuuki_Taiko/status/1175566699887652864"}, {"id": "1175425197228249091", "date": "2019-09-22T00:03:00.020000+09:00", "text": "#きりの超人を応援する会\n頑張れ！！！応援するで！！！", "wayback": "https://web.archive.org/web/20190921172158/https://twitter.com/Yuuki_Taiko/status/1175425197228249091"}, {"id": "1175352629087485952", "date": "2019-09-21T19:14:38.427000+09:00", "text": "エモ今日はここまで詰まりました。\nしかもこれ1000コンボ越えてからの12分で出すまで全良やったの流石にビビったwwwwwwpic.twitter.com/rFaX8JnZIU", "wayback": "https://web.archive.org/web/20190921103240/https://twitter.com/Yuuki_Taiko/status/1175352629087485952"}, {"id": "1175302326921256960", "date": "2019-09-21T15:54:45.456000+09:00", "text": "エモ詰めてるんやけどもうちょっと減らせそう。pic.twitter.com/tHBqj8089o", "wayback": "https://web.archive.org/web/20190921072007/https://twitter.com/Yuuki_Taiko/status/1175302326921256960"}, {"id": "1175241793715101696", "date": "2019-09-21T11:54:13.215000+09:00", "text": "最後の大音で1個出てたし、第二ゴーゴーで大量に出した・・・。pic.twitter.com/DsWSFNs00X", "wayback": "https://web.archive.org/web/20190921025633/https://twitter.com/Yuuki_Taiko/status/1175241793715101696"}, {"id": "1175240773639405568", "date": "2019-09-21T11:50:10.010000+09:00", "text": "問題外なミスしたんマジでもったいない。pic.twitter.com/Y4yGGvwyDo", "wayback": "https://web.archive.org/web/20190921025422/https://twitter.com/Yuuki_Taiko/status/1175240773639405568"}, {"id": "1175235278564294656", "date": "2019-09-21T11:28:19.882000+09:00", "text": "また13出した。\nもったいない所減ったらマジで一桁乗ると思う。pic.twitter.com/wDAlztwAat", "wayback": "https://web.archive.org/web/20190921023156/https://twitter.com/Yuuki_Taiko/status/1175235278564294656"}, {"id": "1175212206079692800", "date": "2019-09-21T09:56:38.973000+09:00", "text": "ひとまず魔人エモフルコンボ出来ました！！！！pic.twitter.com/JTO1qMHQaa", "wayback": "https://web.archive.org/web/20190921010918/https://twitter.com/Yuuki_Taiko/status/1175212206079692800"}, {"id": "1174969001115439104", "date": "2019-09-20T17:50:14.391000+09:00", "text": "は･･･。pic.twitter.com/rezljeiaCc", "wayback": "https://web.archive.org/web/20190920085711/https://twitter.com/Yuuki_Taiko/status/1174969001115439104"}, {"id": "1174961999744131076", "date": "2019-09-20T17:22:25.134000+09:00", "text": "どっちも前半やった件。pic.twitter.com/sI5SmKKOJ3", "wayback": "https://web.archive.org/web/20190920083829/https://twitter.com/Yuuki_Taiko/status/1174961999744131076"}, {"id": "1174961665692979200", "date": "2019-09-20T17:21:05.490000+09:00", "text": "ぷちょへんざでたらめ終わったんで、テーマソングの方もでたらめで全良出来ました！！！\nこれでぐでたまの曲は2曲とも正規・でたらめ全良完了しました！！！\nでたらめ全良\n39.ぐでたまテーマソングpic.twitter.com/VYspX8zpdF", "wayback": "https://web.archive.org/web/20190920083154/https://twitter.com/Yuuki_Taiko/status/1174961665692979200"}, {"id": "1174944293644976129", "date": "2019-09-20T16:12:03.671000+09:00", "text": "さっきのでたらめ全良出来そうやと思ったんで、やってみたら正規より3回早く終わりました！！！\nしかも狙い始めて1クレで終わりました！！！\n初日にでたらめ全良も出来たの何気に初めてですw\nでたらめ全良\n38.ぐでたまぷちょへんざpic.twitter.com/KbltLG2AJp", "wayback": "https://web.archive.org/web/20190920072704/https://twitter.com/Yuuki_Taiko/status/1174944293644976129"}, {"id": "1174939021291581440", "date": "2019-09-20T15:51:06.644000+09:00", "text": "6回中2回チキン踏みましたが、全良出来ました！！！\nで、7以下制覇も取り戻せました！！！（n回目）\n全良593譜面目\nぐでたまぷちょへんざ！！！！！！\n#ぐでぐでの達人pic.twitter.com/DKeLaYCQs2", "wayback": "https://web.archive.org/web/20190920065838/https://twitter.com/Yuuki_Taiko/status/1174939021291581440"}, {"id": "1173876010804117504", "date": "2019-09-17T17:27:05.194000+09:00", "text": "https://youtu.be/gDH_eOPRdHg \n0-0通過してかつ残り400コンボくらいまで全良とかヤバすぎるwwwwwwwwwwww", "wayback": "https://web.archive.org/web/20190917083228/https://twitter.com/Yuuki_Taiko/status/1173876010804117504"}, {"id": "1173217294480109569", "date": "2019-09-15T21:49:34.984000+09:00", "text": "あとこれ。\n初めて可一桁踏んだときに3（6）とか出したからそのうち全良狙ってみる。pic.twitter.com/1b2zNsHmsI", "wayback": "https://web.archive.org/web/20190915131951/https://twitter.com/Yuuki_Taiko/status/1173217294480109569"}, {"id": "1173216178388389892", "date": "2019-09-15T21:45:08.887000+09:00", "text": "Noiz1個だけ可減ったけど、この時410コンボくらいまで全良やったし、もったいない可もいくつかあったんで一桁乗せときたいな・・・。pic.twitter.com/cHoaTh6yNo", "wayback": "https://web.archive.org/web/20190915164520/https://twitter.com/Yuuki_Taiko/status/1173216178388389892"}, {"id": "1173090722557255680", "date": "2019-09-15T13:26:37.886000+09:00", "text": "精度はあれですけど、重金属フューギティブようやくフルコンボ出来ました！！！！pic.twitter.com/3g9fhi414t", "wayback": "https://web.archive.org/web/20190915074708/https://twitter.com/Yuuki_Taiko/status/1173090722557255680"}, {"id": "1173042796694888449", "date": "2019-09-15T10:16:11.470000+09:00", "text": "は？wwwwwwwww\nビバ来たら太鼓に10人以上おんねんけどwwwwwwwww\nしかもこれからまた増えるから今日エグいことになりそうwwwwwwwwwwww", "wayback": "https://web.archive.org/web/20190915052324/https://twitter.com/Yuuki_Taiko/status/1173042796694888449"}, {"id": "1172851792159236096", "date": "2019-09-14T21:37:12.440000+09:00", "text": "今日玄人の曲詰めてたんですけど全然詰まらなくて調子悪かったです。\nそんな中気分転換で（調子悪かったから意味なかった）でたらめやったら全良1譜面増えました。\nでたらめ全良\n37.マスカットpic.twitter.com/o2nbjvSplg", "wayback": "https://web.archive.org/web/20190915111611/https://twitter.com/Yuuki_Taiko/status/1172851792159236096"}, {"id": "1172800078899138560", "date": "2019-09-14T18:11:43.038000+09:00", "text": "見事にフラグ回収しましたねwwwwwwwwwwwwwwwwwwwwwwwwhttps://twitter.com/Drum_Monsteer/status/1172426021917753344 …", "wayback": "https://web.archive.org/web/20190914112022/https://twitter.com/Yuuki_Taiko/status/1172800078899138560"}, {"id": "1172795902634803200", "date": "2019-09-14T17:55:07.339000+09:00", "text": "ヤバいwwwwwwwww\nひろとがグリーン達人合格した！！！！！！\nポセイドン可3とか上手すぎるwwwwwwwwwwww\n最終理論値0-0-3です。\nひろとマジでおめでとう！！！pic.twitter.com/OB1bxDS2Uv", "wayback": "https://web.archive.org/web/20190915020708/https://twitter.com/Yuuki_Taiko/status/1172795902634803200"}, {"id": "1172743992057839618", "date": "2019-09-14T14:28:50.893000+09:00", "text": "ひろと疾風怒濤裏全良してポセイドンも一桁乗ったけど可8で不合格・・・。\nマジで頑張ってくれ・・・。pic.twitter.com/tQrhHoD9sR", "wayback": "https://web.archive.org/web/20190914062152/https://twitter.com/Yuuki_Taiko/status/1172743992057839618"}, {"id": "1172720995074854912", "date": "2019-09-14T12:57:27.985000+09:00", "text": "50台乗ったけど全然減らへん・・・。pic.twitter.com/t7lfqcHJQQ", "wayback": "https://web.archive.org/web/20190914121211/https://twitter.com/Yuuki_Taiko/status/1172720995074854912"}, {"id": "1172705955970076673", "date": "2019-09-14T11:57:42.383000+09:00", "text": "まだまだやなぁ・・・。pic.twitter.com/3Noj8pYYoz", "wayback": "https://web.archive.org/web/20190914121541/https://twitter.com/Yuuki_Taiko/status/1172705955970076673"}, {"id": "1171786873573801984", "date": "2019-09-11T23:05:36.064000+09:00", "text": "フォロワー2900人になりました！！！\nたくさんのフォローありがとうございます！！！\nこれからも無理せず頑張ります！！！pic.twitter.com/7nRJgLVH5I", "wayback": "https://web.archive.org/web/20190914174404/https://twitter.com/Yuuki_Taiko/status/1171786873573801984"}, {"id": "1171196069402660864", "date": "2019-09-10T07:57:57.373000+09:00", "text": "そういや日曜に重金属詰めてたときに1回不可1踏んだんだよな・・・。\n可は減っても不可は減らないっていうのがよくあるパターンなんやけど、これに関してはその逆なのヤバい・・・。pic.twitter.com/C0fTD45Xmc", "wayback": "https://web.archive.org/web/20190925111220/https://twitter.com/Yuuki_Taiko/status/1171196069402660864"}, {"id": "1170658142880858117", "date": "2019-09-08T20:20:25.696000+09:00", "text": "Doom Noiz可15でフルコンボ出来ました！！！\nその次のプレイは可14でフルコンボ出来ました！！！pic.twitter.com/q3kror34bv", "wayback": "https://web.archive.org/web/20190923111552/https://twitter.com/Yuuki_Taiko/status/1170658142880858117"}, {"id": "1170558927940939782", "date": "2019-09-08T13:46:11.011000+09:00", "text": "不可は置いといて\nひとまず玄人理論値全部可2桁に出来ました！！\n長い戦いになるのは確実になると思いますが、頑張ります！！！pic.twitter.com/uA8GCz6kyA", "wayback": "https://web.archive.org/web/20190923053300/https://twitter.com/Yuuki_Taiko/status/1170558927940939782"}, {"id": "1170522062898655232", "date": "2019-09-08T11:19:41.700000+09:00", "text": "Noiz可10台乗りました！！！\nあと、24（4）出したとき420コンボくらいまで全良してました。pic.twitter.com/YCMY009iSM", "wayback": "https://web.archive.org/web/20190923033321/https://twitter.com/Yuuki_Taiko/status/1170522062898655232"}, {"id": "1170290493550252032", "date": "2019-09-07T19:59:31.265000+09:00", "text": "こないだ詰めてたとき可は減ってもフルコンボすることができなくて\nめっっっっっっっちゃ回数かけましたが、\nDoom Noizようやくフルコンボ出来ました！！！\n可の数もう少し減らしたいんで頑張ります！！！pic.twitter.com/83Dn71SzRW", "wayback": "https://web.archive.org/web/20190922082958/https://twitter.com/Yuuki_Taiko/status/1170290493550252032"}, {"id": "1170289882859655168", "date": "2019-09-07T19:57:05.665000+09:00", "text": "3譜面ともちょっと予想以上に回数かけましたが、全良出来ました！！！\nマスカットはなぜかAIで全良しましたwwwwww\nで、これで7以下制覇も取り戻せました！！！\n全良\n590.ぐでたま テーマソング\n591.マスカット\n592.ププッとフムっとかいけつダンスpic.twitter.com/XEVnNnAbxB", "wayback": "https://web.archive.org/web/20190922082439/https://twitter.com/Yuuki_Taiko/status/1170289882859655168"}, {"id": "1168142030083543040", "date": "2019-09-01T21:42:17.658000+09:00", "text": "#9月になったので音ゲーマーフォロー祭\n京都ドンだーです。\n蒼・翠10段\n全良589（☆10→24）譜面、☆7以下制覇（現行）してます。\n今作は玄人を頑張ってみようかなと思います。pic.twitter.com/jdQooZu3zh", "wayback": "https://web.archive.org/web/20190910200731/https://twitter.com/Yuuki_Taiko/status/1168142030083543040"}, {"id": "1168125149356314625", "date": "2019-09-01T20:35:12.979000+09:00", "text": "俺もこの2個見てたけどひろとマジで上手すぎwwwwwwwww\nあとノイズ再全良もしてたからヤバいwwwwwwwww", "wayback": "https://web.archive.org/web/20190909204203/https://twitter.com/Yuuki_Taiko/status/1168125149356314625"}, {"id": "1168121961098006528", "date": "2019-09-01T20:22:32.839000+09:00", "text": "撮れんかったし今の自己べのスコアは可3桁やけど、重金属やっと可2桁乗った。（95）\n不可は4まで減らせれたけどそこからは進展なかった。\nノイズもやけど特に重金属が詰まらなマジで話にならへん。", "wayback": "https://web.archive.org/web/20190910080709/https://twitter.com/Yuuki_Taiko/status/1168121961098006528"}, {"id": "1168004579994169344", "date": "2019-09-01T12:36:07.003000+09:00", "text": "今のところ\n可は1枚目\n不可は2枚目まで減らせれてる。\nもうちょっと減らしたい。pic.twitter.com/iC9khLBZFX", "wayback": "https://web.archive.org/web/20190910174451/https://twitter.com/Yuuki_Taiko/status/1168004579994169344"}];let visible=[],shown=0;const feed=document.getElementById('feed'),footer=document.getElementById('footer');const q=document.getElementById('q'),order=document.getElementById('order');const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){const term=q.value.toLowerCase();visible=DATA.filter(x=>x.text.toLowerCase().includes(term));if(order.value==='old')visible.reverse();shown=0;feed.innerHTML='';document.getElementById('count').textContent=visible.length;more()}function more(){if(shown>=visible.length){footer.textContent=visible.length?'すべて表示しました':'該当する投稿はありません';return}const batch=visible.slice(shown,shown+35);feed.insertAdjacentHTML('beforeend',batch.map(x=>'<article class="post"><div><span class="name">ゆうき</span> <span class="handle">@Yuuki_Taiko</span> · <span class="date">'+esc(x.date.slice(0,10))+'</span></div><div class="text">'+esc(x.text)+'</div><div class="actions"><a href="'+esc(x.wayback)+'" target="_blank" rel="noopener noreferrer">Waybackで元ページを開く ↗</a></div></article>').join(''));shown+=batch.length;footer.textContent=shown+' / '+visible.length+'件'}q.addEventListener('input',reset);order.addEventListener('change',reset);window.addEventListener('scroll',()=>{if(window.innerHeight+window.scrollY>document.body.offsetHeight-800)more()});reset();</script></body></html>
